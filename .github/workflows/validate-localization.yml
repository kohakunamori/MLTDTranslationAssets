name: Validate Localization Repository

on:
  push:
    branches: [ main ]
    paths:
      - 'locales/**'
      - 'lyrics/**'
      - 'images/**'
      - 'manifests/**'
      - 'pipelines/**'
      - 'scripts/**'
      - 'schema/**'
      - '.github/workflows/validate-localization.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'locales/**'
      - 'lyrics/**'
      - 'images/**'
      - 'manifests/**'
      - 'pipelines/**'
      - 'scripts/**'
      - 'schema/**'
      - '.github/workflows/validate-localization.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight reviewed locale changes
        if: github.event_name == 'pull_request'
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          AFTER_SHA: ${{ github.sha }}
        run: python scripts/promote_merged_locales.py --before "$BEFORE_SHA" --after "$AFTER_SHA"

      - name: Run repository validation
        run: |
          python scripts/validate_repo.py
