# Standard GitHub-hosted Linux runners execute these validation jobs.
name: Validate Localization Repository

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'locales/**'
      - 'lyrics/**'
      - 'images/**'
      - 'manifests/**'
      - 'pipelines/**'
      - 'scripts/**'
      - 'schema/**'
      - 'asset-server/**'
      - 'configs/image-cohort.json'
      - 'configs/localization-pipeline.json'
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'requirements-ci.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'locales/**'
      - 'lyrics/**'
      - 'images/**'
      - 'manifests/**'
      - 'pipelines/**'
      - 'scripts/**'
      - 'schema/**'
      - 'asset-server/**'
      - 'configs/image-cohort.json'
      - 'configs/localization-pipeline.json'
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'requirements-ci.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        # `generated/` and `images/` are 880 MB of this repository's 1.09 GB
        # working copy and neither suite below opens them, so the checkout asks
        # for everything else.  `filter: blob:none` is what makes that saving
        # real: without it the fetch still transfers every blob and only the
        # write to disk gets smaller.  Add a top-level directory here when a
        # suite starts reading one.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            asset-server
            configs
            docs
            glossary
            locales
            lyrics
            manifests
            pipelines
            research-tools
            schema
            scripts
            server
            tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight reviewed locale changes
        if: github.event_name == 'pull_request'
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          AFTER_SHA: ${{ github.sha }}
        run: python scripts/promote_merged_locales.py --before "$BEFORE_SHA" --after "$AFTER_SHA"

      - name: Run repository validation
        run: |
          python scripts/validate_repo.py

  regression:
    name: Offline regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        # Deliberately narrower than the `validate` job above: no suite in this
        # job reads `locales/` or `lyrics/` (every one of them builds its own
        # fixtures in a temp directory), and `validate_repo.py` -- which does
        # walk both trees -- runs in the other job.  Dropping them takes the
        # checkout from 210 MB to 11 MB.  `scripts/test_validate_workflow.py`
        # fails if a directory the suites import from disappears from this list
        # or if this list grows something the other job does not check out.
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            asset-server
            configs
            docs
            glossary
            manifests
            pipelines
            research-tools
            schema
            scripts
            server
            tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        # uv resolves and installs the same nine packages in about a second
        # where pip took six.  Its cache key follows `**/requirements*.txt` by
        # default, so requirements-ci.txt invalidates it on purpose; the wheel
        # cache setup-python used to keep is redundant now.
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install test dependencies
        # Keep this list in sync with asset-server/requirements.txt: the
        # regression suite imports requests.  Verified in a clean venv.
        run: uv pip install --system -r requirements-ci.txt

      - name: Run the offline suites that gate publishing
        # Workflow contracts run below; actionlint also validates Actions syntax.
        # scripts/test_assets_generated_index.py keeps one known-red migration
        # assertion (the old store notes wording "shard" vs
        # "retired fan-out"). The immutable-freeze sandbox is part of this gate.
        #
        # Standard hosted Linux runners use four workers.
        # --dist worksteal hands a free worker
        # the next pending test instead of pinning a whole file to one process.
        # That is safe here because every test builds its own fixtures in a temp
        # directory, the only setUpClass hooks parse YAML read-only, and the
        # servers bind an ephemeral port (127.0.0.1:0).  The two slow files --
        # asset-server/test_service_e2e.py (5 x 3.6 s) and
        # scripts/test_should_build_release.py (8 x 2 s) -- leave the other two
        # workers idle under the previous loadfile rule: 27.6 s vs 18.8 s.
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTEST_WORKERS: '4'
        run: |
          python -m pytest -q -n "$PYTEST_WORKERS" --dist worksteal \
            scripts/test_llm_translate_untranslated.py \
            scripts/test_asset_translation_context.py \
            scripts/test_audit_human_lyrics.py \
            scripts/test_llm_translate_workflow.py \
            scripts/test_text_job_handoff.py \
            scripts/test_translation_prompt_policy.py \
            scripts/test_promote_merged_locales.py \
            scripts/test_build_generated_release.py \
            scripts/test_bundle_incremental.py \
            scripts/test_image_ci_state.py \
            scripts/test_localization_features.py \
            scripts/test_localization_coverage.py \
            scripts/test_image_model_contract.py \
            scripts/test_publish_image_overlay.py \
            scripts/test_reuse_published_images.py \
            scripts/test_r2_release_storage.py \
            scripts/test_analyze_r2_observability.py \
            asset-server/cloudflare/test_check_gateway_cache.py \
            scripts/test_incremental_images.py \
            scripts/test_image_translation.py \
            scripts/test_image_resources.py \
            scripts/test_export_portal_originals.py \
            scripts/test_materialize_human_images.py \
            scripts/test_release_reuse.py \
            scripts/test_build_lyric_overlay.py \
            scripts/test_source_provenance.py \
            scripts/test_commit_llm_drafts.py \
            scripts/test_should_build_release.py \
            scripts/test_publish_generated_release.py \
            scripts/test_ci_pipeline.py \
            scripts/test_auto_track_jp_assets_workflow.py \
            scripts/test_assets_mirror.py \
            scripts/test_refresh_latest_official_catalogue.py \
            scripts/test_official_bundle_families.py \
            scripts/test_discover_official_bundles.py \
            scripts/test_refresh_lyrics_catalogue.py \
            scripts/test_validate_repo_lyrics.py \
            scripts/test_validate_workflow.py \
            pipelines/core/test_core.py \
            pipelines/text/test_mltd_localize_scrobj.py \
            pipelines/text/test_mltd_lyric_rules.py \
            pipelines/text/test_provider_text_closure.py \
            asset-server \
            server/tests

      - name: Validate all workflow syntax and reusable calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lint_dir="$(mktemp -d "${RUNNER_TEMP}/mltd-actionlint.XXXXXX")"
          trap 'rm -rf "$lint_dir"' EXIT
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz \
            --pattern actionlint_1.7.12_checksums.txt --dir "$lint_dir"
          (cd "$lint_dir" && sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt)
          tar -xzf "$lint_dir/actionlint_1.7.12_linux_amd64.tar.gz" -C "$lint_dir" actionlint
          # GitHub supports concurrency.queue; actionlint 1.7.12 predates it.
          # The regression gate validates queue=max on every R2 writer.
          "$lint_dir/actionlint" -shellcheck='' -pyflakes='' \
            -ignore 'unexpected key "queue" for "concurrency" section'
