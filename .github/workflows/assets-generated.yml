name: Build generated Assets

'on':
  push:
    branches: [main]
    paths:
      - 'locales/**'
      - 'lyrics/**'
      - 'images/**'
      - 'image-overlay/**'
      - 'manifests/**'
      - 'pipelines/**'
      - 'scripts/**'
      - 'schema/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even when the committed release already matches the current inputs'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # 产物发布完之后要显式派发网关部署。不能靠 `workflow_run`：实测四次
  # workflow_dispatch 触发的构建（#40/#52/#54/#62）一次都没有唤起网关工作流，
  # 而发布提交带 `[skip ci]`、push 事件也被抑制——于是"由翻译任务派发出来的
  # 新产物"永远到不了 CDN。详见 cloudflare-gateway.yml 顶部注释。
  actions: write

concurrency:
  group: assets-generated-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Promote reviewed locale changes
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'No push parent is available (manual dispatch); nothing to promote.'
          else
            python scripts/promote_merged_locales.py \
              --before "$BEFORE_SHA" \
              --after "$AFTER_SHA"
          fi

      - name: Decide whether the release is already current
        # The release is content-addressed and a pure function of `locales/`,
        # `manifests/`, `pipelines/`, `schema/`, `images/`, `lyrics/` and the
        # scripts that write the bundles.  Rebuilding identical inputs produces
        # identical objects, so a push that only touches CI plumbing, tests or
        # docs must not spend six to ten runner minutes.  The gate is fail-open:
        # anything it cannot prove (no release, unreadable commit, dirty tree
        # from the promotion step, a git error) answers build=true.
        # Dispatch with force=true after changing the build procedure itself.
        id: gate
        env:
          FORCE_BUILD: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          python scripts/should_build_release.py --force "$FORCE_BUILD" | tee .release-gate.json
          build="$(python -c 'import json; print(str(json.load(open(".release-gate.json"))["build"]).lower())')"
          reason="$(python -c 'import json; print(json.load(open(".release-gate.json"))["reason"])')"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          {
            echo '### Generated release'
            echo "- build: \`$build\`"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install asset pipeline dependencies
        if: steps.gate.outputs.build == 'true'
        run: python -m pip install --disable-pip-version-check msgpack UnityPy Pillow pycryptodome

      - name: Validate translation source
        if: steps.gate.outputs.build == 'true'
        run: python scripts/validate_repo.py

      - name: Restore the official object cache
        if: steps.gate.outputs.build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .generated-work/official-by-content
          key: official-by-content-${{ hashFiles('manifests/asset-version.json') }}
          restore-keys: |
            official-by-content-

      - name: Build generated Unity3D release
        if: steps.gate.outputs.build == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          # Same value the gate above decides with: a forced dispatch rebuilds
          # everything, and an incremental build here would silently keep the
          # bundles the force was meant to regenerate.
          FORCE_BUILD: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          ASSET_VERSION="$(python -c "import json; print(json.load(open('manifests/asset-version.json'))['asset_version'])")"
          image_args=()
          OVERLAY_MANIFEST="image-overlay/${ASSET_VERSION}/overlay-manifest.json"
          if [ -f "$OVERLAY_MANIFEST" ]; then
            # An audited overlay exists for exactly this asset version, so the
            # image surface ships with the text surface in one release: same
            # catalogue, one writer, one push.
            INDEX_NAME="$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['client_manifest_name'])" "$OVERLAY_MANIFEST")"
            image_args+=(
              --require-images
              --image-overlay-manifest "$OVERLAY_MANIFEST"
              --image-overlay-root "image-overlay/${ASSET_VERSION}/jp-android"
              --image-index "image-overlay/${ASSET_VERSION}/jp-android/${INDEX_NAME}"
            )
            echo "Image overlay found for ${ASSET_VERSION}; publishing the image surface."
          else
            echo "No image overlay for ${ASSET_VERSION}; publishing the text surface only."
          fi
          reuse_args=()
          if [ "$FORCE_BUILD" = "true" ]; then
            # A forced dispatch exists to rebuild after the procedure itself
            # changed, so it must not carry old bundles over: the proof that a
            # bundle did not change says nothing about a changed writer.
            reuse_args+=(--no-reuse)
          fi
          python scripts/build_generated_release.py \
            --source-commit "$SOURCE_COMMIT" \
            --translation-commit "$SOURCE_COMMIT" \
            --generated-commit "$SOURCE_COMMIT" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --official-cache .generated-work/official-by-content \
            "${reuse_args[@]}" \
            "${image_args[@]}"

      - name: Save the official object cache
        if: always() && steps.gate.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .generated-work/official-by-content
          key: official-by-content-${{ hashFiles('manifests/asset-version.json') }}

      - name: Verify generated release
        if: steps.gate.outputs.build == 'true'
        run: |
          ASSET_VERSION="$(python -c "import json; print(json.load(open('manifests/asset-version.json'))['asset_version'])")"
          python scripts/assets_generated_index.py verify \
            --root generated \
            --asset-version "$ASSET_VERSION"

      - name: Build portal resource manifest
        if: steps.gate.outputs.build == 'true'
        run: |
          ASSET_VERSION="$(python -c "import json; print(json.load(open('manifests/asset-version.json'))['asset_version'])")"
          python scripts/build_portal_resource_manifest.py \
            --generated-manifest "generated/${ASSET_VERSION}/manifest.json" \
            --output manifests/portal-resource-manifest.json

      - name: Commit reviewed translations and generated release
        id: publish
        if: steps.gate.outputs.build == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/ locales/ manifests/portal-resource-manifest.json
          if git diff --cached --quiet; then
            echo 'No reviewed translation or generated release changes.'
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "build(assets): publish reviewed translations and generated release [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'Unable to rebase generated output onto the latest main.' >&2
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main advanced during generated publish (attempt ${attempt}); retrying."
            sleep $((attempt * 5))
          done
          echo 'main continued advancing while publishing generated output.' >&2
          exit 1

      - name: Deploy the CDN gateway onto the new release
        # 必须在上一步真的推了提交之后才部署：网关的对照表锚定在"最后一次改动
        # generated/<version>/manifest.json 的提交"上，没有新提交就没有新内容。
        #
        # 这一跳以前挂在 workflow_run 上（"上游构建完成"）。实测那条路对
        # workflow_dispatch 触发的构建不生效，而发布提交又带 `[skip ci]` 导致 push
        # 事件被抑制，所以由翻译任务派发出来的产物从来没有真正上线过——线上网关一度
        # 落后主线两个发布。现在改成显式派发，两条入口（push 与 dispatch）都能走到。
        if: steps.gate.outputs.build == 'true' && steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run cloudflare-gateway.yml --ref main
          echo "Dispatched cloudflare-gateway.yml on main for the release just committed."
