name: Reusable - build and publish R2 release

'on':
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
      review_before:
        type: string
        default: ''
      review_after:
        type: string
        default: ''
    outputs:
      pushed:
        value: ${{ jobs.build.outputs.pushed }}
      rebuild:
        value: ${{ jobs.build.outputs.rebuild }}

permissions:
  contents: write
  # Only stale builds enqueue a new production run; deployment is a caller job.
  actions: write

concurrency:
  group: assets-generated-main
  cancel-in-progress: false

jobs:
  build:
    concurrency:
      group: r2-mutation
      queue: max
      cancel-in-progress: false
    outputs:
      pushed: ${{ steps.publish.outputs.pushed }}
      rebuild: ${{ steps.publish.outputs.rebuild }}
    runs-on: ubuntu-latest
    # Bounded so a stalled cache restore or a wedged Unity3D assembly cannot hold
    # the `assets-generated-main` group for the default six hours and block every
    # later release behind it. Measured runs on 2026-10-13: 1.7-3.4 minutes, so
    # this is ~13x the observed worst case and only fires on a hang.
    timeout-minutes: 45
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          # Keep manifests for the gate; fetch large binaries only for a build.
          sparse-checkout: |
            /*
            !/generated/objects/
            !/generated/build-inputs/
            !/images/
            !/image-overlay/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Promote reviewed locale changes
        env:
          BEFORE_SHA: ${{ github.event.before || inputs.review_before || '' }}
          AFTER_SHA: ${{ inputs.review_after || github.sha }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'No push parent is available (manual dispatch); nothing to promote.'
          else
            python scripts/promote_merged_locales.py \
              --before "$BEFORE_SHA" \
              --after "$AFTER_SHA"
          fi

      - name: Decide whether the release is already current
        # The release is content-addressed and a pure function of `locales/`,
        # `manifests/`, `pipelines/`, `schema/`, `images/`, `lyrics/` and the
        # scripts that write the bundles.  Rebuilding identical inputs produces
        # identical objects, so a push that only touches CI plumbing, tests or
        # docs must not spend six to ten runner minutes.  The gate is fail-open:
        # anything it cannot prove (no release, unreadable commit, dirty tree
        # from the promotion step, a git error) answers build=true.
        # Dispatch with force=true after changing the build procedure itself.
        id: gate
        env:
          FORCE_BUILD: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          python scripts/should_build_release.py --force "$FORCE_BUILD" | tee .release-gate.json
          build="$(python -c 'import json; print(str(json.load(open(".release-gate.json"))["build"]).lower())')"
          reason="$(python -c 'import json; print(json.load(open(".release-gate.json"))["reason"])')"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          python -c 'import json, os; value=json.load(open(".release-gate.json")); open(os.environ["GITHUB_OUTPUT"], "a").write("asset_version=" + str(value["asset_version"]) + "\n")'
          {
            echo '### Generated release'
            echo "- build: \`$build\`"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Materialize build inputs after the gate
        id: features
        if: steps.gate.outputs.build == 'true'
        run: |
          python scripts/localization_features.py --report .localization-features.json --github-output "$GITHUB_OUTPUT"
          if python -c 'import json, sys; sys.exit(0 if json.load(open(".localization-features.json"))["images_publication_enabled"] else 1)'; then
            git sparse-checkout disable
          else
            git sparse-checkout set --no-cone '/*' '!/images/' '!/image-overlay/'
          fi

      - name: Install asset pipeline dependencies
        if: steps.gate.outputs.build == 'true'
        run: python -m pip install --disable-pip-version-check msgpack UnityPy Pillow pycryptodome requests

      - name: Restore retained releases and parsed inputs from R2
        if: steps.gate.outputs.build == 'true'
        env:
          R2_PUBLISH_TOKEN: ${{ secrets.R2_PUBLISH_TOKEN }}
          ASSET_VERSION: ${{ steps.gate.outputs.asset_version }}
          IMAGES_GENERATION_ENABLED: ${{ steps.features.outputs.images_generation_enabled }}
        run: |
          args=()
          if [ -f "image-overlay/${ASSET_VERSION}/overlay-manifest.json" ]; then
            args+=(--overlay-version "$ASSET_VERSION")
          fi
          python scripts/r2_release_storage.py restore "${args[@]}"

      - name: Validate translation source
        if: steps.gate.outputs.build == 'true'
        run: python scripts/validate_repo.py

      - name: Repack explicitly approved image sources without model calls
        if: steps.gate.outputs.build == 'true' && steps.features.outputs.images_publication_enabled == 'true'
        run: |
          python -m venv .generated-work/human-image-env
          .generated-work/human-image-env/bin/python -m pip install --disable-pip-version-check \
            -r pipelines/image/requirements-injection.txt msgpack requests pycryptodome
          .generated-work/human-image-env/bin/python scripts/materialize_human_images.py \
            --work .generated-work/human-images

      - name: Preserve manual image repack evidence
        if: always() && steps.gate.outputs.build == 'true' && steps.features.outputs.images_publication_enabled == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: human-image-repack-audit
          path: |
            .generated-work/human-images/install.jsonl
            .generated-work/human-images/*report.json
            .generated-work/human-images/*audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Restore the official object cache
        id: official-cache
        if: steps.gate.outputs.build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .generated-work/official-by-content
          # v5 scopes text, image and event sources by logical name: the catalogue
          # fingerprint alone can collide across distinct official bundles.
          key: official-by-content-v5-${{ steps.gate.outputs.asset_version }}-images-${{ steps.features.outputs.images_publication_enabled }}
          restore-keys: |
            official-by-content-

      - name: Build generated Unity3D release
        if: steps.gate.outputs.build == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          ASSET_VERSION: ${{ steps.gate.outputs.asset_version }}
          IMAGES_GENERATION_ENABLED: ${{ steps.features.outputs.images_generation_enabled }}
          IMAGES_PUBLICATION_ENABLED: ${{ steps.features.outputs.images_publication_enabled }}
          # Same value the gate above decides with: a forced dispatch rebuilds
          # everything, and an incremental build here would silently keep the
          # bundles the force was meant to regenerate.
          FORCE_BUILD: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          image_args=()
          OVERLAY_MANIFEST="image-overlay/${ASSET_VERSION}/overlay-manifest.json"
          if [ "$IMAGES_PUBLICATION_ENABLED" = "true" ]; then
            image_args+=(--reuse-published-images)
            if [ -f "$OVERLAY_MANIFEST" ]; then
              INDEX_NAME="$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['client_manifest_name'])" "$OVERLAY_MANIFEST")"
              image_args+=(--require-images --image-overlay-manifest "$OVERLAY_MANIFEST"
                --image-overlay-root "image-overlay/${ASSET_VERSION}/jp-android"
                --image-index "image-overlay/${ASSET_VERSION}/jp-android/${INDEX_NAME}")
            fi
          fi
          reuse_args=()
          if [ "$FORCE_BUILD" = "true" ]; then
            # A forced dispatch exists to rebuild after the procedure itself
            # changed, so it must not carry old bundles over: the proof that a
            # bundle did not change says nothing about a changed writer.
            reuse_args+=(--no-reuse)
          fi
          python scripts/build_generated_release.py \
            --source-commit "$SOURCE_COMMIT" \
            --translation-commit "$SOURCE_COMMIT" \
            --generated-commit "$SOURCE_COMMIT" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --official-cache .generated-work/official-by-content \
            "${reuse_args[@]}" \
            "${image_args[@]}"

      - name: Save the official object cache
        if: success() && steps.gate.outputs.build == 'true' && steps.official-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .generated-work/official-by-content
          key: ${{ steps.official-cache.outputs.cache-primary-key }}

      - name: Verify generated release
        if: steps.gate.outputs.build == 'true'
        env:
          ASSET_VERSION: ${{ steps.gate.outputs.asset_version }}
        run: |
          python scripts/assets_generated_index.py verify \
            --root generated \
            --asset-version "$ASSET_VERSION"

      - name: Build portal resource manifest
        if: steps.gate.outputs.build == 'true'
        env:
          ASSET_VERSION: ${{ steps.gate.outputs.asset_version }}
        run: |
          python scripts/build_portal_resource_manifest.py \
            --generated-manifest "generated/${ASSET_VERSION}/manifest.json" \
            --output manifests/portal-resource-manifest.json

      - name: Upload and verify immutable R2 objects before publishing metadata
        if: steps.gate.outputs.build == 'true'
        env:
          R2_PUBLISH_TOKEN: ${{ secrets.R2_PUBLISH_TOKEN }}
        run: python scripts/r2_release_storage.py publish

      - name: Commit reviewed translations and release metadata
        id: publish
        if: steps.gate.outputs.build == 'true'
        env:
          FORCE_BUILD: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_generated_release.py --force "$FORCE_BUILD"

      - name: Rebuild main after a release input changed
        # A translation/version/writer update cannot inherit an older build.
        # Dispatch explicitly: GITHUB_TOKEN source pushes may not start CI.
        if: steps.publish.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force || 'false' }}
          REVIEW_BEFORE: ${{ github.event.before || inputs.review_before || '' }}
          REVIEW_AFTER: ${{ inputs.review_after || github.sha }}
        run: |
          set -euo pipefail
          gh workflow run auto-track-jp-assets.yml --ref main -f stage=release -f force_build="$FORCE_BUILD" \
            -f review_before="$REVIEW_BEFORE" -f review_after="$REVIEW_AFTER"
          echo 'Main advanced during the build; queued a build of its new inputs.' >> "$GITHUB_STEP_SUMMARY"
