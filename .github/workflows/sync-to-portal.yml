name: Sync Localization to Web Portal D1

on:
  push:
    branches: [ main ]
    paths:
      - 'locales/**'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Perform a full synchronization (re-sync all locales)'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    name: Sync to D1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect Changed Locales Files
        id: changed-files
        run: |
          if [ "${{ github.event.inputs.full_sync }}" = "true" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "Performing full sync"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "Workflow dispatch: performing full sync"
          else
            # Get files changed in the latest commit
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^locales/' | grep '\.jsonl$' || true)
            if [ -z "$CHANGED" ]; then
              echo "mode=full" >> $GITHUB_OUTPUT
              echo "No specific changed jsonl files found, defaulting to full sync"
            else
              echo "mode=incremental" >> $GITHUB_OUTPUT
              echo "files<<EOF" >> $GITHUB_OUTPUT
              echo "$CHANGED" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "Found incremental changed files:"
              echo "$CHANGED"
            fi
          fi

      - name: Generate D1 Sync SQL Batches
        run: |
          mkdir -p work/d1-sync
          if [ "${{ steps.changed-files.outputs.mode }}" = "incremental" ]; then
            echo "Running incremental export..."
            FILES=$(echo "${{ steps.changed-files.outputs.files }}" | tr '\n' ' ')
            python scripts/sync_to_d1.py --repo-root . --out-dir work/d1-sync --batch-size 3000 --files $FILES
          else
            echo "Running full export..."
            python scripts/sync_to_d1.py --repo-root . --out-dir work/d1-sync --batch-size 3000
          fi

      - name: Execute SQL Batches to Remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "WARNING: CLOUDFLARE_API_TOKEN is not configured. Skipping D1 remote sync."
            exit 0
          fi

          SQL_FILES=$(ls -1 work/d1-sync/contributions-batch-*.sql 2>/dev/null || true)
          if [ -z "$SQL_FILES" ]; then
            echo "No SQL files generated. Nothing to sync."
            exit 0
          fi

          for f in $SQL_FILES; do
            echo "Applying $f to remote D1..."
            npx wrangler d1 execute mltd-translation-portal --remote --file="$f"
          done

          echo "D1 synchronization completed successfully!"
