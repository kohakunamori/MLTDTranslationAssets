name: Assets production pipeline
run-name: Assets [${{ github.event_name == 'push' && 'release' || inputs.stage || 'watch' }}]

# Keep this filename so the existing external version watcher needs no reconfiguration.
'on':
  push:
    branches: [main]
    paths:
      - 'locales/**'
      - 'lyrics/**'
      - 'images/**'
      - 'image-overlay/**'
      - 'manifests/**'
      - 'generated/**'
      - 'pipelines/**'
      - 'scripts/**'
      - 'schema/**'
      - 'configs/**'
      - 'asset-server/cloudflare/**'
      - 'asset-server/r2-publisher/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      stage:
        description: 'watch, translate, images, release (existing results), gateway, or full'
        type: choice
        options: [watch, translate, images, release, gateway, full]
        default: watch
      force_check:
        description: 'Compatibility input for the existing external watcher'
        type: boolean
        default: true
      daily_housekeeping:
        description: 'Watch mode: retry leftovers without a new version'
        default: 'false'
      force_build:
        description: 'Rebuild instead of reusing unchanged bundles'
        type: boolean
        default: false
      max_items:
        description: 'Translation smoke limit; 0 continues resumable batches'
        default: '0'
      max_bundles:
        description: 'Optional source extraction limit'
        default: '0'
      full_rescan:
        description: 'Ignore the official source memo'
        type: boolean
        default: false
      publish_drafts:
        description: 'Admit validated machine drafts with provenance'
        default: 'true'
      review_before:
        description: 'Reviewed range carried by a stale build retry'
        default: ''
      review_after:
        description: 'Reviewed range end'
        default: ''

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  # Reusable stage writers have their own independent locks.
  group: assets-production-${{ github.event_name == 'push' && 'release' || inputs.stage || 'watch' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      track: ${{ steps.plan.outputs.track }}
      deploy: ${{ steps.plan.outputs.deploy }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            manifests
            configs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Plan this production run
        id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_STAGE: ${{ inputs.stage || 'watch' }}
          CI_BEFORE: ${{ github.event.before || '' }}
        run: python scripts/ci_pipeline.py

  resolve-target:
    name: Resolve track target
    needs: plan
    if: needs.plan.outputs.track == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_update: ${{ steps.check-version.outputs.has_update }}
      current_version: ${{ steps.check-version.outputs.current_version }}
      latest_version: ${{ steps.check-version.outputs.latest_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_commit }}
          filter: blob:none
          sparse-checkout: |
            scripts
            manifests
            configs

      - name: Bind the resolved commit to this checkout
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKOUT_SHA" != "${{ needs.plan.outputs.source_commit }}" ]; then
            echo "FAIL: checkout HEAD ${CHECKOUT_SHA} != github.sha ${{ needs.plan.outputs.source_commit }}" >&2
            echo "Every write below records this commit as the source commit; refusing to continue." >&2
            exit 1
          fi
          echo "CHECKOUT_SHA=${CHECKOUT_SHA}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Japanese asset version
        id: check-version
        run: |
          set -euo pipefail
          mkdir -p work
          set +e
          python scripts/track_jp_assets.py --check-only --output-json work/asset-report.json
          EXIT_CODE=$?
          set -e
          echo "track_jp_assets --check-only exit=${EXIT_CODE}"
          case "$EXIT_CODE" in
            0)
              python -c 'import json,os; r=json.load(open("work/asset-report.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("latest_version="+str(r["latest_version"])+"\ncurrent_version="+str(r["current_version"])+"\n")'
              # 0 = 已是最新，没有更新；这是唯一允许“无更新”的退出码。
              echo "has_update=false" >> "$GITHUB_OUTPUT"
              echo "No new asset version detected."
              ;;
            10)
              # 10 = 检测到更新。报告文件缺失或解析失败必须 fail，不得当作无更新。
              LATEST_VER=$(python -c "import json;print(json.load(open('work/asset-report.json'))['latest_version'])") \
                || { echo "FAIL: work/asset-report.json missing or unparseable" >&2; exit 1; }
              CURRENT_VER=$(python -c "import json;print(json.load(open('work/asset-report.json'))['current_version'])") \
                || { echo "FAIL: work/asset-report.json missing or unparseable" >&2; exit 1; }
              case "$LATEST_VER$CURRENT_VER" in
                *[!0-9]*) echo "FAIL: non-numeric version in report (${CURRENT_VER} -> ${LATEST_VER})" >&2; exit 1 ;;
              esac
              if [ "$LATEST_VER" -le "$CURRENT_VER" ]; then
                echo "FAIL: exit 10 but latest ${LATEST_VER} <= current ${CURRENT_VER}" >&2
                exit 1
              fi
              echo "has_update=true" >> "$GITHUB_OUTPUT"
              echo "latest_version=$LATEST_VER" >> "$GITHUB_OUTPUT"
              echo "current_version=$CURRENT_VER" >> "$GITHUB_OUTPUT"
              echo "Found new asset version: $CURRENT_VER -> $LATEST_VER"
              ;;
            *)
              # 网络/API/解析等其他退出码：显式失败。旧版把任何非 10 都当作
              # “无更新”，一次 API 故障会被静默记为成功。
              echo "FAIL: track_jp_assets.py --check-only exited ${EXIT_CODE}; treating as failure, not as 'no update'." >&2
              exit 1
              ;;
          esac

  freeze:
    name: Freeze outgoing asset version
    needs: [plan, resolve-target]
    if: needs.resolve-target.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # 只用于推送冻结标签；不推分支、不建 PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_commit }}
          filter: blob:none
          sparse-checkout: |
            scripts
            manifests
            configs

      - name: Freeze the outgoing asset version tag
        env:
          OLD_VER: ${{ needs.resolve-target.outputs.current_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKOUT_SHA" != "${{ needs.plan.outputs.source_commit }}" ]; then
            echo "FAIL: checkout HEAD ${CHECKOUT_SHA} != github.sha ${{ needs.plan.outputs.source_commit }}" >&2
            exit 1
          fi
          TARGET="$CHECKOUT_SHA"

          # 版本命名约定：`main` 始终跟随最新资源版本；离开的那一版用单一标签冻结，
          # 供仍锁定旧版本的消费者复现。标签名是单轴纯数字版本，禁止复合串——
          # Client 与 Assets 是两条独立发布轴（scripts/export_localization_for_github.py
          # 的 validate_asset_axis 会拒绝复合版本）。
          case "$OLD_VER" in
            *"+"*|*client-*)
              echo "FAIL: asset version '$OLD_VER' looks composite; refuse to tag it" >&2
              exit 1
              ;;
          esac
          case "$OLD_VER" in
            ''|*[!0-9]*) echo "FAIL: current_version '$OLD_VER' is not numeric" >&2; exit 1 ;;
          esac

          TAG="assets-$OLD_VER"
          echo "Freeze target: tag ${TAG} -> commit ${TARGET}"

          # 先查远端状态，失败可见（旧版 `git tag -f ... || true` 会把本地打标失败
          # 吞掉，再用 -f 强推覆盖远端标签）。两个 ref 一起查，并且优先取 `^{}` 那
          # 一行：附注标签在 ls-remote 里给出的是标签对象，不是提交，直接和 HEAD
          # 比较永远不会相等，会把“标签已经正确”误判成冲突。
          REMOTE_LINE="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" || true)"
          REMOTE_SHA="$(printf '%s\n' "$REMOTE_LINE" | awk -v ref="refs/tags/${TAG}^{}" '$2 == ref {print $1; exit}')"
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA="$(printf '%s\n' "$REMOTE_LINE" | awk -v ref="refs/tags/${TAG}" '$2 == ref {print $1; exit}')"
          fi

          if [ -z "$REMOTE_SHA" ]; then
            # 远端还没有这个标签：创建，且 source 显式写 TARGET，不依赖任何本地 ref。
            git push origin "${TARGET}:refs/tags/${TAG}"
            echo "Created freeze tag ${TAG} at ${TARGET}."
            exit 0
          fi

          if [ "$REMOTE_SHA" = "$TARGET" ]; then
            echo "OK: tag ${TAG} already points at ${TARGET}; freeze is a no-op."
            exit 0
          fi

          # 标签已经在别的提交上。只有它确实冻结着「正在离开的这一版」才可以接受：
          # 冻结本身不可变，沿用一份已经正确的冻结不会改变任何消费者读到的
          # source_commit，也不会重写历史；而指向别的版本的标签仍然必须失败。
          # 这里读该标签提交上的 manifest，避免为了它做一次全历史浅克隆。
          FROZEN_VER="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/manifests/asset-version.json?ref=${REMOTE_SHA}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("asset_version",""))' 2>/dev/null || true)"
          if [ "$FROZEN_VER" = "$OLD_VER" ]; then
            echo "OK: tag ${TAG} already freezes asset version ${OLD_VER} at ${REMOTE_SHA}; keeping it."
            echo "Freeze tags are immutable, so nothing is re-pointed and no consumer changes source_commit."
            exit 0
          fi

          echo "FAIL: tag ${TAG} already exists at ${REMOTE_SHA}, but this run would freeze ${TARGET}." >&2
          echo "Existing freeze tags are immutable: re-pointing one would silently change the" >&2
          echo "source_commit that generated/<asset_version>/manifest.json records. No --force is used." >&2
          echo "That tag does not record asset version ${OLD_VER} (it records '${FROZEN_VER:-unknown}'), so it cannot be reused." >&2
          exit 1

  translate:
    needs: [plan, resolve-target, freeze]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.track != 'true' || needs.resolve-target.result == 'success') &&
      (needs.freeze.result == 'success' || needs.freeze.result == 'skipped') &&
      (needs.plan.outputs.stage == 'translate' || needs.plan.outputs.stage == 'full' ||
       (needs.plan.outputs.stage == 'watch' && needs.resolve-target.result == 'success' &&
        (needs.resolve-target.outputs.has_update == 'true' || inputs.daily_housekeeping == 'true')))
    uses: ./.github/workflows/llm-translate-assets.yml
    with:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      expected_version: ${{ needs.resolve-target.outputs.latest_version }}
      max_items: ${{ inputs.max_items || '0' }}
      max_bundles: ${{ inputs.max_bundles || '0' }}
      full_rescan: ${{ inputs.full_rescan || false }}
      publish_drafts: ${{ inputs.publish_drafts || 'true' }}
    secrets: inherit

  images:
    needs: plan
    if: needs.plan.outputs.stage == 'images'
    uses: ./.github/workflows/image-localize-assets.yml
    with:
      enabled: true
      max_items: ${{ inputs.max_items || '0' }}
    secrets: inherit

  release:
    needs: [plan, translate, images]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.stage == 'release' ||
       (needs.images.result == 'success' && needs.images.outputs.published == 'true') ||
       (needs.translate.result == 'success' && needs.translate.outputs.ready == 'true' &&
        (needs.translate.outputs.published == 'true' || needs.plan.outputs.stage == 'full')))
    uses: ./.github/workflows/assets-generated.yml
    with:
      force: ${{ inputs.force_build || false }}
      review_before: ${{ github.event.before || inputs.review_before || '' }}
      review_after: ${{ inputs.review_after || github.sha }}
    secrets: inherit

  gateway:
    needs: [plan, release]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.stage == 'gateway' ||
       (needs.release.result == 'success' && needs.release.outputs.rebuild != 'true' &&
        (needs.release.outputs.pushed == 'true' || needs.plan.outputs.deploy == 'true')))
    uses: ./.github/workflows/cloudflare-gateway.yml
    secrets: inherit

  continue-backlog:
    needs: [plan, translate, release, gateway]
    if: >-
      always() && !cancelled() && needs.translate.result == 'success' &&
      needs.translate.outputs.ready == 'true' &&
      needs.translate.outputs.remaining != '' && needs.translate.outputs.remaining != '0' &&
      needs.release.result != 'failure' && needs.gateway.result != 'failure' &&
      (inputs.max_items == '0' || inputs.max_items == '') &&
      (needs.translate.outputs.stopped == 'budget' ||
       needs.translate.outputs.stopped == 'max_rounds')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Continue only a backlog this run ran out of room for
        # The translation job now retries its own leftovers in-place (bounded by
        # a wall-clock budget and a round count), so an unfinished queue is only
        # worth another whole run when that loop was cut short: `budget` or
        # `max_rounds`.  Every other reason means retrying again today would do
        # the same work for the same answer -- `no_progress` (the last round
        # settled nothing), `drained`, or `limited` (an operator-set max_items).
        # Before this, three unlucky rows cost three extra pipeline runs: each
        # one rebuilt the release and redeployed the gateway to settle one line.
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_DRAFTS: ${{ inputs.publish_drafts || 'true' }}
        run: |
          gh workflow run auto-track-jp-assets.yml --ref main -f stage=translate \
            -f max_items=0 -f publish_drafts="$PUBLISH_DRAFTS"

  continue-images:
    needs: [plan, images, translate, release, gateway]
    if: >-
      always() && !cancelled() && needs.release.result != 'failure' && needs.gateway.result != 'failure' &&
      (inputs.max_items == '0' || inputs.max_items == '') &&
      ((needs.images.result == 'success' && needs.images.outputs.completed != '0' &&
        needs.images.outputs.completed != '' && needs.images.outputs.remaining != '0' &&
        needs.images.outputs.remaining != '') ||
       (needs.translate.result == 'success' && needs.translate.outputs.image_completed != '0' &&
        needs.translate.outputs.image_completed != '' && needs.translate.outputs.image_remaining != '0' &&
        needs.translate.outputs.image_remaining != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run auto-track-jp-assets.yml --ref main -f stage=images -f max_items=0

  summary:
    needs: [plan, resolve-target, freeze, translate, images, release, gateway, continue-backlog, continue-images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record all stage outcomes in this run
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### Production pipeline\n\n| stage | result |\n| --- | --- |\n')
              for name, value in json.loads(os.environ['RESULTS']).items():
                  out.write('| ' + name + ' | ' + value['result'] + ' |\n')
          PY
