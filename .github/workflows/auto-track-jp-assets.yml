name: Auto Track Japanese Assets

'on':
  schedule:
    # Run once daily at 16:00 UTC (01:00 JST / 00:00 CST)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force_check:
        description: 'Force run version check'
        required: false
        default: true
        type: boolean

jobs:
  track:
    name: Check New Asset Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Japanese Asset Version
        id: check-version
        run: |
          mkdir -p work
          set +e
          python scripts/track_jp_assets.py --check-only --output-json work/asset-report.json
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -eq 10 ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            LATEST_VER=$(python -c "import json; print(json.load(open('work/asset-report.json'))['latest_version'])")
            CURRENT_VER=$(python -c "import json; print(json.load(open('work/asset-report.json'))['current_version'])")
            echo "latest_version=$LATEST_VER" >> $GITHUB_OUTPUT
            echo "current_version=$CURRENT_VER" >> $GITHUB_OUTPUT
            echo "Found new asset version: $CURRENT_VER -> $LATEST_VER"
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "No new asset version detected."
          fi

      - name: Freeze the outgoing asset version
        if: steps.check-version.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_VER="${{ steps.check-version.outputs.current_version }}"

          # Version convention: `main` always carries the newest asset version.
          # The state being left behind is frozen so an older version stays
          # reproducible for anyone still pinned to it.
          #
          # The freeze point is a TAG, not a branch. The `assets-<version>` tag
          # is a single-axis name: it identifies one frozen asset state, which
          # is exactly what a later `generated/<asset_version>/manifest.json`
          # records as its `source_commit`.
          #
          # This step used to ALSO push a `release/<client_version>+<asset_version>`
          # branch. That has been removed on purpose: Client and Assets are
          # independent release axes, and a branch name that concatenates them
          # (`release/9.0.200+1077500`) is a composite version — the exact string
          # the rest of the pipeline now refuses
          # (`scripts/export_localization_for_github.py::validate_asset_axis`).
          # Creating one here would manufacture a name the release tooling
          # cannot read. If a composite branch is ever seen again, it is a bug
          # in this workflow, not a valid release identity.
          if [[ "$OLD_VER" == *"+"* || "$OLD_VER" == *"client-"* ]]; then
            echo "FAIL: asset version '$OLD_VER' looks composite; refuse to tag it" >&2
            exit 1
          fi

          TAG="assets-$OLD_VER"
          git tag -f "$TAG" >/dev/null 2>&1 || true
          git push -f origin "$TAG"
          echo "Froze asset $OLD_VER as tag $TAG (no release branch: composite versions are forbidden)."

      - name: Update Manifest and Create Pull Request
        if: steps.check-version.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_VER="${{ steps.check-version.outputs.latest_version }}"
          CURRENT_VER="${{ steps.check-version.outputs.current_version }}"

          # Update the version manifest
          python scripts/track_jp_assets.py --update

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="chore/asset-update-$LATEST_VER"
          git checkout -b "$BRANCH_NAME"
          git add manifests/asset-version.json
          git commit -m "chore(assets): track new Japanese asset version $LATEST_VER"
          git push -u origin "$BRANCH_NAME" --force

          # Create PR
          PR_TITLE="chore(assets): detect and track Japanese asset version $LATEST_VER"
          PR_URL=$(gh pr create --title "$PR_TITLE" --body "Detected new Japanese asset version $LATEST_VER from Matsurihi API. Updated manifests/asset-version.json." --head "$BRANCH_NAME" --base main) || PR_URL=$(gh pr view "$BRANCH_NAME" --json url --jq .url)
          echo "PR: $PR_URL"

          # The manifest is informational: it records which asset version the
          # repository is tracking, and the validation workflow gates the diff.
          # Merge it directly instead of leaving the detection stranded in an
          # open PR nobody revisits. `main` always tracks the newest version.
          gh pr merge "$PR_URL" --squash --delete-branch || echo "Auto-merge failed; merge $PR_URL manually"
