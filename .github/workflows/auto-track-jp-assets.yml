name: Auto Track Japanese Assets

# 每日跟踪日版资源版本（Matsurihi API）。检测到新版本时：
#   1. 把“离开的那一版”冻结成单一标签 assets-<version>（immutable：已存在且指向
#      其他提交时直接失败，绝不移动）；该标签是后续 generated/<asset_version>/
#      manifest.json 记录的 source_commit。
#   2. 通过 PR 更新 manifests/asset-version.json —— 不再由 bot 直接合并到 main。
#      此前 `gh pr merge --squash` 会绕过任何开启中的分支保护/审核要求；无论保护
#      当前是否开启，bot 都不应自行合并，main 的推进保留给 owner/审查。
#
# 写路径全部绑定到 checkout 的固定提交：每个 job 都用 ref: ${{ github.sha }} 拉取，
# 并在写操作前核对 git rev-parse HEAD 与 github.sha 一致，避免“用移动中的分支头
# 冒充 source commit”。

'on':
  schedule:
    # Run once daily at 16:00 UTC (01:00 JST / 00:00 CST)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force_check:
        description: 'Force run version check'
        required: false
        default: true
        type: boolean

concurrency:
  # 定时跟踪会推冻结标签与更新分支；手动运行排队等待，不与写者竞争。
  group: assets-track-jp-version
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve track target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_update: ${{ steps.check-version.outputs.has_update }}
      current_version: ${{ steps.check-version.outputs.current_version }}
      latest_version: ${{ steps.check-version.outputs.latest_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Bind the resolved commit to this checkout
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKOUT_SHA" != "${{ github.sha }}" ]; then
            echo "FAIL: checkout HEAD ${CHECKOUT_SHA} != github.sha ${{ github.sha }}" >&2
            echo "Every write below records this commit as the source commit; refusing to continue." >&2
            exit 1
          fi
          echo "CHECKOUT_SHA=${CHECKOUT_SHA}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Japanese asset version
        id: check-version
        run: |
          set -euo pipefail
          mkdir -p work
          set +e
          python scripts/track_jp_assets.py --check-only --output-json work/asset-report.json
          EXIT_CODE=$?
          set -e
          echo "track_jp_assets --check-only exit=${EXIT_CODE}"
          case "$EXIT_CODE" in
            0)
              # 0 = 已是最新，没有更新；这是唯一允许“无更新”的退出码。
              echo "has_update=false" >> "$GITHUB_OUTPUT"
              echo "No new asset version detected."
              ;;
            10)
              # 10 = 检测到更新。报告文件缺失或解析失败必须 fail，不得当作无更新。
              LATEST_VER=$(python -c "import json;print(json.load(open('work/asset-report.json'))['latest_version'])") \
                || { echo "FAIL: work/asset-report.json missing or unparseable" >&2; exit 1; }
              CURRENT_VER=$(python -c "import json;print(json.load(open('work/asset-report.json'))['current_version'])") \
                || { echo "FAIL: work/asset-report.json missing or unparseable" >&2; exit 1; }
              case "$LATEST_VER$CURRENT_VER" in
                *[!0-9]*) echo "FAIL: non-numeric version in report (${CURRENT_VER} -> ${LATEST_VER})" >&2; exit 1 ;;
              esac
              if [ "$LATEST_VER" -le "$CURRENT_VER" ]; then
                echo "FAIL: exit 10 but latest ${LATEST_VER} <= current ${CURRENT_VER}" >&2
                exit 1
              fi
              echo "has_update=true" >> "$GITHUB_OUTPUT"
              echo "latest_version=$LATEST_VER" >> "$GITHUB_OUTPUT"
              echo "current_version=$CURRENT_VER" >> "$GITHUB_OUTPUT"
              echo "Found new asset version: $CURRENT_VER -> $LATEST_VER"
              ;;
            *)
              # 网络/API/解析等其他退出码：显式失败。旧版把任何非 10 都当作
              # “无更新”，一次 API 故障会被静默记为成功。
              echo "FAIL: track_jp_assets.py --check-only exited ${EXIT_CODE}; treating as failure, not as 'no update'." >&2
              exit 1
              ;;
          esac

  freeze:
    name: Freeze outgoing asset version
    needs: resolve-target
    if: needs.resolve-target.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # 只用于推送冻结标签；不推分支、不建 PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Freeze the outgoing asset version tag
        env:
          OLD_VER: ${{ needs.resolve-target.outputs.current_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKOUT_SHA" != "${{ github.sha }}" ]; then
            echo "FAIL: checkout HEAD ${CHECKOUT_SHA} != github.sha ${{ github.sha }}" >&2
            exit 1
          fi
          TARGET="$CHECKOUT_SHA"

          # 版本命名约定：`main` 始终跟随最新资源版本；离开的那一版用单一标签冻结，
          # 供仍锁定旧版本的消费者复现。标签名是单轴纯数字版本，禁止复合串——
          # Client 与 Assets 是两条独立发布轴（scripts/export_localization_for_github.py
          # 的 validate_asset_axis 会拒绝复合版本）。
          case "$OLD_VER" in
            *"+"*|*client-*)
              echo "FAIL: asset version '$OLD_VER' looks composite; refuse to tag it" >&2
              exit 1
              ;;
          esac
          case "$OLD_VER" in
            ''|*[!0-9]*) echo "FAIL: current_version '$OLD_VER' is not numeric" >&2; exit 1 ;;
          esac

          TAG="assets-$OLD_VER"
          echo "Freeze target: tag ${TAG} -> commit ${TARGET}"

          # 先查远端状态，失败可见（旧版 `git tag -f ... || true` 会把本地打标失败
          # 吞掉，再用 -f 强推覆盖远端标签）。两个 ref 一起查，并且优先取 `^{}` 那
          # 一行：附注标签在 ls-remote 里给出的是标签对象，不是提交，直接和 HEAD
          # 比较永远不会相等，会把“标签已经正确”误判成冲突。
          REMOTE_LINE="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" || true)"
          REMOTE_SHA="$(printf '%s\n' "$REMOTE_LINE" | awk -v ref="refs/tags/${TAG}^{}" '$2 == ref {print $1; exit}')"
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA="$(printf '%s\n' "$REMOTE_LINE" | awk -v ref="refs/tags/${TAG}" '$2 == ref {print $1; exit}')"
          fi

          if [ -z "$REMOTE_SHA" ]; then
            # 远端还没有这个标签：创建，且 source 显式写 TARGET，不依赖任何本地 ref。
            git push origin "${TARGET}:refs/tags/${TAG}"
            echo "Created freeze tag ${TAG} at ${TARGET}."
            exit 0
          fi

          if [ "$REMOTE_SHA" = "$TARGET" ]; then
            echo "OK: tag ${TAG} already points at ${TARGET}; freeze is a no-op."
            exit 0
          fi

          # 标签已经在别的提交上。只有它确实冻结着「正在离开的这一版」才可以接受：
          # 冻结本身不可变，沿用一份已经正确的冻结不会改变任何消费者读到的
          # source_commit，也不会重写历史；而指向别的版本的标签仍然必须失败。
          # 这里读该标签提交上的 manifest，避免为了它做一次全历史浅克隆。
          FROZEN_VER="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/manifests/asset-version.json?ref=${REMOTE_SHA}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("asset_version",""))' 2>/dev/null || true)"
          if [ "$FROZEN_VER" = "$OLD_VER" ]; then
            echo "OK: tag ${TAG} already freezes asset version ${OLD_VER} at ${REMOTE_SHA}; keeping it."
            echo "Freeze tags are immutable, so nothing is re-pointed and no consumer changes source_commit."
            exit 0
          fi

          echo "FAIL: tag ${TAG} already exists at ${REMOTE_SHA}, but this run would freeze ${TARGET}." >&2
          echo "Existing freeze tags are immutable: re-pointing one would silently change the" >&2
          echo "source_commit that generated/<asset_version>/manifest.json records. No --force is used." >&2
          echo "That tag does not record asset version ${OLD_VER} (it records '${FROZEN_VER:-unknown}'), so it cannot be reused." >&2
          exit 1

  update-pr:
    name: Update manifest and open PR
    needs: resolve-target
    if: needs.resolve-target.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # 推更新分支
      pull-requests: write  # 创建/查找 PR（不合并）
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update manifest and open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VER: ${{ needs.resolve-target.outputs.current_version }}
          LATEST_VER: ${{ needs.resolve-target.outputs.latest_version }}
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKOUT_SHA" != "${{ github.sha }}" ]; then
            echo "FAIL: checkout HEAD ${CHECKOUT_SHA} != github.sha ${{ github.sha }}" >&2
            exit 1
          fi

          MANIFEST="manifests/asset-version.json"
          BRANCH="chore/asset-update-${LATEST_VER}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          HEAD_VER=$(python -c "import json;print(json.load(open('${MANIFEST}'))['asset_version'])") \
            || { echo "FAIL: cannot read ${MANIFEST} at ${CHECKOUT_SHA}" >&2; exit 1; }

          # 幂等：checkout 的 manifest 已是目标版本则无事可做（重跑/取消重试都不制造空提交）。
          if [ "$HEAD_VER" = "$LATEST_VER" ]; then
            echo "Already tracking ${LATEST_VER} at ${CHECKOUT_SHA}; nothing to update."
            exit 0
          fi
          if [ "$HEAD_VER" != "$CURRENT_VER" ]; then
            echo "FAIL: checkout tracks ${HEAD_VER}, but the version check reported current ${CURRENT_VER}." >&2
            exit 1
          fi

          python scripts/track_jp_assets.py --update
          NEW_VER=$(python -c "import json;print(json.load(open('${MANIFEST}'))['asset_version'])") \
            || { echo "FAIL: ${MANIFEST} unreadable after --update" >&2; exit 1; }
          if [ "$NEW_VER" != "$LATEST_VER" ]; then
            echo "FAIL: --update wrote ${NEW_VER}, expected ${LATEST_VER}" >&2
            exit 1
          fi
          if git diff --quiet -- "${MANIFEST}"; then
            echo "Manifest content already matches ${LATEST_VER}; no commit needed."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add "$MANIFEST"
          git commit -m "chore(assets): track new Japanese asset version ${LATEST_VER}"

          # 推分支：一律不带 force（含重试）。远端已存在同名分支时绝不重写它——
          # 该分支只可能是本 bot 上一次运行留下的等价更新（`last_synced_at` 每次
          # 不同，内容重复无意义），直接复用；若它包含任何非本 bot 的单文件提交，
          # 显式失败退出，避免覆盖他人工。
          REMOTE_LINE="$(git ls-remote origin "refs/heads/${BRANCH}" || true)"
          REMOTE_SHA="$(printf '%s\n' "$REMOTE_LINE" | awk '{print $1}' | head -n1)"

          if [ -z "$REMOTE_SHA" ]; then
            git push -u origin "HEAD:refs/heads/${BRANCH}"
          else
            # 这里不能再用本地的提交遍历：本 job 是浅克隆（fetch-depth 1），
            # `git rev-list <分支> --not HEAD` 会把分支历史里所有更早的提交都当成
            # “本分支独有”，于是把 main 自己的旧提交误判成他人工，永远拒绝复用。
            # 判定条件不变——只有本 bot 的单文件更新可以复用——但把“分支相对 main
            # 多了什么”交给服务器回答，深度就再也不会影响结论。
            git fetch --quiet --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" --depth=1 || true
            COMPARE="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${BRANCH}" \
              --jq '[.ahead_by, ([.files[].filename] | join(",")), ([.commits[].commit.author.email] | unique | join(","))] | @tsv' \
              2>/dev/null || true)"
            AHEAD="$(printf '%s' "$COMPARE" | cut -f1)"
            FILES="$(printf '%s' "$COMPARE" | cut -f2)"
            AUTHORS="$(printf '%s' "$COMPARE" | cut -f3)"
            if [ -z "$AHEAD" ]; then
              echo "FAIL: cannot read how ${BRANCH} compares to main; refusing to reuse it." >&2
              exit 1
            fi
            if [ "$AHEAD" != "0" ] && { [ "$FILES" != "$MANIFEST" ] || \
                 [ "$AUTHORS" != "github-actions[bot]@users.noreply.github.com" ]; }; then
              echo "FAIL: remote ${BRANCH} is ${AHEAD} commit(s) ahead of main, changing [${FILES}] by [${AUTHORS}]" >&2
              echo "Refusing to reuse a branch that is not purely this bot's single-file update." >&2
              exit 1
            fi
            echo "Reusing existing tracker branch ${BRANCH} at ${REMOTE_SHA} (no push, no rewrite)."
          fi

          # 建档 PR（不合并）：main 的推进保留给 owner/审查。
          PR_URL="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url' 2>/dev/null || true)"
          if [ -z "$PR_URL" ] && [ -n "$REMOTE_SHA" ]; then
            # 分支已存在于远端：如果它与当前提交对 manifest 没有差异（例如已经被合并过），
            # 就没有可开的 PR，直接结束。
            if git diff --quiet "refs/remotes/origin/${BRANCH}" "${CHECKOUT_SHA}" -- "$MANIFEST"; then
              echo "OK: ${BRANCH} adds no manifest change over ${CHECKOUT_SHA}; nothing to open."
              exit 0
            fi
          fi
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create \
              --title "chore(assets): detect and track Japanese asset version ${LATEST_VER}" \
              --body "Detected new Japanese asset version ${LATEST_VER} from Matsurihi API (source commit ${CHECKOUT_SHA}). Updated manifests/asset-version.json. Freeze tag for the outgoing version is handled by the freeze job." \
              --head "$BRANCH" --base main)"
          fi
          echo "PR: $PR_URL"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Asset version ${CURRENT_VER} -> ${LATEST_VER}"
              echo "- source commit: \`${CHECKOUT_SHA}\`"
              echo "- branch: \`${BRANCH}\`"
              echo "- pull request (merge left to the owner): ${PR_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
