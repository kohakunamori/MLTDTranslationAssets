name: Auto Track Japanese Assets

# 跟踪日版资源版本（Matsurihi API）。检测到新版本时：
#   1. 把“离开的那一版”冻结成单一标签 assets-<version>（immutable：已存在且指向
#      其他提交时直接失败，绝不移动）；该标签是后续 generated/<asset_version>/
#      manifest.json 记录的 source_commit。
#   2. 立刻叫醒翻译工作流（workflow_dispatch）。本流程自己**不再**改
#      manifests/asset-version.json，也不开 PR。
#
# 为什么不再开 PR：版本号只能有一个写者，而那个写者是翻译工作流本身——
# scripts/commit_llm_drafts.py 会把 manifests/asset-version.json 和其它译料一起推上
# main。旧流程既开一张“等 owner 合并”的申请单、又让翻译工作流直接推 main，结果是
# 每个版本都留下一张永远追不上的申请单（例如 #40），而真正推进版本号的始终是
# 翻译工作流。这里保留 bot 的底线：它不合并、也不直接推 main——只读、只冻结标签、
# 只派发。
#
# 触发方式：只由 vps_racknerd 上的 mltd-asset-watch.timer 派发，两种情况——
#   1. 官方出了新版本（每 5 分钟查一次）：本流程冻结离开的那一版，再叫醒翻译任务；
#   2. 兜底叫醒（同一台机器每 24 小时按一次，带 daily_housekeeping=true）：没有新版本
#      也叫一次翻译任务（重试失败过的行、推进待审草稿），并顺便按一次图片汉化。
#
# 仓库这边**不再有定时**：GitHub 的 cron 实测被推迟 4~7 小时（16:00 UTC 的那次实际
# 19:48~21:03 UTC 才启动），同一天还出现过一次推送完全不产生任何事件。2026-10-12 起
# 唯一的时钟在 VPS 上，整条链只有一个入口：
#     本流程 → 翻译任务 → 产物构建 → CDN 网关 → 查阅站
# 后面每一跳都是显式派发（workflow_dispatch），不依赖隐式事件——“出包派发网关”这一跳
# 曾经挂在 workflow_run 上，四次由翻译任务派发的构建因此产出了四个从未上线的发布。
#
# 写路径全部绑定到 checkout 的固定提交：每个 job 都用 ref: ${{ github.sha }} 拉取，
# 并在写操作前核对 git rev-parse HEAD 与 github.sha 一致，避免“用移动中的分支头
# 冒充 source commit”。

'on':
  workflow_dispatch:
    inputs:
      force_check:
        description: 'Force run version check'
        required: false
        default: true
        type: boolean
      daily_housekeeping:
        description: '兜底叫醒：没有新版本也要叫翻译任务重试失败过的行、推进待审草稿，并按一次图片汉化'
        required: false
        default: 'false'

concurrency:
  # 冻结标签是写操作；手动运行排队等待，不与写者竞争。
  group: assets-track-jp-version
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve track target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_update: ${{ steps.check-version.outputs.has_update }}
      current_version: ${{ steps.check-version.outputs.current_version }}
      latest_version: ${{ steps.check-version.outputs.latest_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Bind the resolved commit to this checkout
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKOUT_SHA" != "${{ github.sha }}" ]; then
            echo "FAIL: checkout HEAD ${CHECKOUT_SHA} != github.sha ${{ github.sha }}" >&2
            echo "Every write below records this commit as the source commit; refusing to continue." >&2
            exit 1
          fi
          echo "CHECKOUT_SHA=${CHECKOUT_SHA}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Japanese asset version
        id: check-version
        run: |
          set -euo pipefail
          mkdir -p work
          set +e
          python scripts/track_jp_assets.py --check-only --output-json work/asset-report.json
          EXIT_CODE=$?
          set -e
          echo "track_jp_assets --check-only exit=${EXIT_CODE}"
          case "$EXIT_CODE" in
            0)
              # 0 = 已是最新，没有更新；这是唯一允许“无更新”的退出码。
              echo "has_update=false" >> "$GITHUB_OUTPUT"
              echo "No new asset version detected."
              ;;
            10)
              # 10 = 检测到更新。报告文件缺失或解析失败必须 fail，不得当作无更新。
              LATEST_VER=$(python -c "import json;print(json.load(open('work/asset-report.json'))['latest_version'])") \
                || { echo "FAIL: work/asset-report.json missing or unparseable" >&2; exit 1; }
              CURRENT_VER=$(python -c "import json;print(json.load(open('work/asset-report.json'))['current_version'])") \
                || { echo "FAIL: work/asset-report.json missing or unparseable" >&2; exit 1; }
              case "$LATEST_VER$CURRENT_VER" in
                *[!0-9]*) echo "FAIL: non-numeric version in report (${CURRENT_VER} -> ${LATEST_VER})" >&2; exit 1 ;;
              esac
              if [ "$LATEST_VER" -le "$CURRENT_VER" ]; then
                echo "FAIL: exit 10 but latest ${LATEST_VER} <= current ${CURRENT_VER}" >&2
                exit 1
              fi
              echo "has_update=true" >> "$GITHUB_OUTPUT"
              echo "latest_version=$LATEST_VER" >> "$GITHUB_OUTPUT"
              echo "current_version=$CURRENT_VER" >> "$GITHUB_OUTPUT"
              echo "Found new asset version: $CURRENT_VER -> $LATEST_VER"
              ;;
            *)
              # 网络/API/解析等其他退出码：显式失败。旧版把任何非 10 都当作
              # “无更新”，一次 API 故障会被静默记为成功。
              echo "FAIL: track_jp_assets.py --check-only exited ${EXIT_CODE}; treating as failure, not as 'no update'." >&2
              exit 1
              ;;
          esac

  freeze:
    name: Freeze outgoing asset version
    needs: resolve-target
    if: needs.resolve-target.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # 只用于推送冻结标签；不推分支、不建 PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Freeze the outgoing asset version tag
        env:
          OLD_VER: ${{ needs.resolve-target.outputs.current_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKOUT_SHA" != "${{ github.sha }}" ]; then
            echo "FAIL: checkout HEAD ${CHECKOUT_SHA} != github.sha ${{ github.sha }}" >&2
            exit 1
          fi
          TARGET="$CHECKOUT_SHA"

          # 版本命名约定：`main` 始终跟随最新资源版本；离开的那一版用单一标签冻结，
          # 供仍锁定旧版本的消费者复现。标签名是单轴纯数字版本，禁止复合串——
          # Client 与 Assets 是两条独立发布轴（scripts/export_localization_for_github.py
          # 的 validate_asset_axis 会拒绝复合版本）。
          case "$OLD_VER" in
            *"+"*|*client-*)
              echo "FAIL: asset version '$OLD_VER' looks composite; refuse to tag it" >&2
              exit 1
              ;;
          esac
          case "$OLD_VER" in
            ''|*[!0-9]*) echo "FAIL: current_version '$OLD_VER' is not numeric" >&2; exit 1 ;;
          esac

          TAG="assets-$OLD_VER"
          echo "Freeze target: tag ${TAG} -> commit ${TARGET}"

          # 先查远端状态，失败可见（旧版 `git tag -f ... || true` 会把本地打标失败
          # 吞掉，再用 -f 强推覆盖远端标签）。两个 ref 一起查，并且优先取 `^{}` 那
          # 一行：附注标签在 ls-remote 里给出的是标签对象，不是提交，直接和 HEAD
          # 比较永远不会相等，会把“标签已经正确”误判成冲突。
          REMOTE_LINE="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" || true)"
          REMOTE_SHA="$(printf '%s\n' "$REMOTE_LINE" | awk -v ref="refs/tags/${TAG}^{}" '$2 == ref {print $1; exit}')"
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA="$(printf '%s\n' "$REMOTE_LINE" | awk -v ref="refs/tags/${TAG}" '$2 == ref {print $1; exit}')"
          fi

          if [ -z "$REMOTE_SHA" ]; then
            # 远端还没有这个标签：创建，且 source 显式写 TARGET，不依赖任何本地 ref。
            git push origin "${TARGET}:refs/tags/${TAG}"
            echo "Created freeze tag ${TAG} at ${TARGET}."
            exit 0
          fi

          if [ "$REMOTE_SHA" = "$TARGET" ]; then
            echo "OK: tag ${TAG} already points at ${TARGET}; freeze is a no-op."
            exit 0
          fi

          # 标签已经在别的提交上。只有它确实冻结着「正在离开的这一版」才可以接受：
          # 冻结本身不可变，沿用一份已经正确的冻结不会改变任何消费者读到的
          # source_commit，也不会重写历史；而指向别的版本的标签仍然必须失败。
          # 这里读该标签提交上的 manifest，避免为了它做一次全历史浅克隆。
          FROZEN_VER="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/manifests/asset-version.json?ref=${REMOTE_SHA}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("asset_version",""))' 2>/dev/null || true)"
          if [ "$FROZEN_VER" = "$OLD_VER" ]; then
            echo "OK: tag ${TAG} already freezes asset version ${OLD_VER} at ${REMOTE_SHA}; keeping it."
            echo "Freeze tags are immutable, so nothing is re-pointed and no consumer changes source_commit."
            exit 0
          fi

          echo "FAIL: tag ${TAG} already exists at ${REMOTE_SHA}, but this run would freeze ${TARGET}." >&2
          echo "Existing freeze tags are immutable: re-pointing one would silently change the" >&2
          echo "source_commit that generated/<asset_version>/manifest.json records. No --force is used." >&2
          echo "That tag does not record asset version ${OLD_VER} (it records '${FROZEN_VER:-unknown}'), so it cannot be reused." >&2
          exit 1

  wake-translation:
    name: Wake the downstream runs
    needs: resolve-target
    # 注意：这里**没有** has_update 门槛。发现新版本时它负责把翻译任务叫起来；
    # 没有新版本、但被“兜底叫醒”（daily_housekeeping）时，它同样要叫一次翻译任务
    # ——重试那些在所有服务商上都失败过的行、推进待审草稿。这是整条链唯一的入口：
    # VPS 只按这一个按钮，后面翻译→出包→网关→查阅站全靠连锁。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # 派发运行要 actions: write。用 GITHUB_TOKEN 派发的 workflow_dispatch 不在
      # GitHub 的“递归触发抑制”范围内（翻译工作流自己也是这样派发产物构建的）。
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Bind the resolved commit to this checkout
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKOUT_SHA" != "${{ github.sha }}" ]; then
            echo "FAIL: checkout HEAD ${CHECKOUT_SHA} != github.sha ${{ github.sha }}" >&2
            exit 1
          fi
          echo "CHECKOUT_SHA=${CHECKOUT_SHA}" >> "$GITHUB_ENV"

      - name: Wake the translation workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_UPDATE: ${{ needs.resolve-target.outputs.has_update }}
          CURRENT_VER: ${{ needs.resolve-target.outputs.current_version }}
          LATEST_VER: ${{ needs.resolve-target.outputs.latest_version }}
          DAILY_HOUSEKEEPING: ${{ github.event.inputs.daily_housekeeping || 'false' }}
        run: |
          set -euo pipefail
          MANIFEST="manifests/asset-version.json"
          WORKFLOW="llm-translate-assets.yml"
          # 上一次翻译任务刚起过头就失败时，不要每几分钟重试一次。
          COOLDOWN_SECONDS=1800

          HEAD_VER=$(python3 -c "import json;print(json.load(open('${MANIFEST}'))['asset_version'])") \
            || { echo "FAIL: cannot read ${MANIFEST}" >&2; exit 1; }

          if [ "${HAS_UPDATE}" = "true" ]; then
            # 幂等：清单已经是目标版本（翻译工作流自己写过了），无事可做。
            # 重跑、取消后重试、或本流程被更频繁地叫醒，都不会制造重复派发。
            if [ "$HEAD_VER" = "$LATEST_VER" ]; then
              echo "Already tracking ${LATEST_VER}; nothing to wake."
              exit 0
            fi
            if [ "$HEAD_VER" != "$CURRENT_VER" ]; then
              echo "FAIL: checkout tracks ${HEAD_VER}, but the version check reported current ${CURRENT_VER}." >&2
              exit 1
            fi
            REASON="asset version ${CURRENT_VER} -> ${LATEST_VER}"
          elif [ "${DAILY_HOUSEKEEPING}" = "true" ]; then
            # 没有新版本：这一轮只为“收尾”而叫醒翻译任务（重试失败过的行、推进待审
            # 草稿）。以前这是 GitHub 每晚那次定时的工作，2026-10-12 起由 VPS 的兜底
            # 叫醒承担。
            REASON="daily housekeeping (no new asset version; retrying leftovers)"
          else
            echo "No new asset version and no daily housekeeping tick; nothing to wake."
            exit 0
          fi

          # 不叠班：已经有排队或运行中的翻译任务时，不再派发第二个。
          # 读不到运行状态时**这一轮什么都不做**（fail closed）：宁可等下一次唤醒，
          # 也不要在看不出有没有在跑的时候再派发一个。
          for status in queued in_progress; do
            COUNT="$(gh run list --workflow="$WORKFLOW" --status="$status" --limit 10 \
              --json databaseId --jq 'length' 2>/dev/null || true)"
            if [ -z "$COUNT" ]; then
              echo "cannot read the ${status} run state of ${WORKFLOW}; leaving this wake to the next one."
              exit 0
            fi
            if [ "$COUNT" != "0" ]; then
              echo "A ${WORKFLOW} run is already ${status} (${COUNT}); not dispatching another."
              exit 0
            fi
          done

          LAST_CREATED="$(gh run list --workflow="$WORKFLOW" --limit 1 \
            --json createdAt --jq '.[0].createdAt // empty')"
          if [ -n "$LAST_CREATED" ]; then
            LAST_EPOCH="$(date -u -d "$LAST_CREATED" +%s)"
            NOW_EPOCH="$(date -u +%s)"
            AGE=$((NOW_EPOCH - LAST_EPOCH))
            if [ "$AGE" -lt "$COOLDOWN_SECONDS" ]; then
              echo "The last ${WORKFLOW} run started ${AGE}s ago (< ${COOLDOWN_SECONDS}s); leaving it room before retrying."
              exit 0
            fi
          fi

          gh workflow run "$WORKFLOW" --ref main
          echo "Dispatched ${WORKFLOW} (${REASON})."
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Wake: ${REASON}"
              echo "- source commit: \`${CHECKOUT_SHA}\`"
              echo "- dispatched: \`${WORKFLOW}\` on \`main\`"
              echo "- freeze tag for the outgoing version: handled by the \`freeze\` job when there is a new version"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Wake the image localization run
        # 图片汉化是个跨好几天、每次接着上次进度的长跑任务，所以只在兜底叫醒的那一轮
        # 按一次（不是每个新版本都按），并且已经有任务在跑时不再叠一个。
        if: ${{ github.event.inputs.daily_housekeeping == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORKFLOW="image-localize-assets.yml"

          for status in queued in_progress; do
            COUNT="$(gh run list --workflow="$WORKFLOW" --status="$status" --limit 10 \
              --json databaseId --jq 'length' 2>/dev/null || true)"
            if [ -z "$COUNT" ]; then
              echo "cannot read the ${status} run state of ${WORKFLOW}; leaving the image wake to the next tick."
              exit 0
            fi
            if [ "$COUNT" != "0" ]; then
              echo "A ${WORKFLOW} run is already ${status} (${COUNT}); not dispatching another."
              exit 0
            fi
          done

          gh workflow run "$WORKFLOW" --ref main
          echo "Dispatched ${WORKFLOW} for the daily image cohort."
