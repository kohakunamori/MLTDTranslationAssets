name: image-localize-assets

# Unattended image localization.
#
# Constraints this workflow encodes:
#   * The upstream image service allows ONE request per minute, so generation is
#     serial.  pipelines/image/provider_config.py paces every image edit with
#     image_provider.min_request_interval_seconds (default 60); the gate is
#     process-global, so extra threads queue instead of stacking calls.
#   * A full cohort (937 pictures at one per minute) cannot finish inside one
#     job, so each run stops on its own time budget, writes progress after every
#     task, and the next run resumes from that same file.
#   * No human sign-off.  The independent audit is the gate; a generated install
#     manifest may only carry the automatic provenance tag, and
#     inject_reviewed_textures.py still re-checks every hash, geometry and
#     roundtrip before a bundle is written.
#
# Completed, reviewed repository outputs are verified before restoring work.
# Pipeline state lives in work/image-localization-25/ and travels between runs
# in the Actions cache.  A run without cached state fails its preflight by name
# rather than generating against an unknown cohort.
#
# Called only from llm-translate-assets.yml. Image work and text translation
# share one packaging hand-off. The checked-in feature policy currently disables
# images because no suitable model provider has been selected.
on:
  workflow_call:
    inputs:
      enabled:
        type: boolean
        default: false
      max_seconds:
        type: string
        default: '18000'
      max_items:
        type: string
        default: '0'
      skip_generation:
        type: boolean
        default: false
    outputs:
      ready:
        value: ${{ jobs.localize.outputs.ready }}
      published:
        value: ${{ jobs.localize.outputs.published }}

concurrency:
  # One writer at a time: two runs would both spend the same rate budget and
  # interleave the same progress file.
  group: image-localize-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      images_enabled: ${{ steps.features.outputs.images_enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read shared localization policy
        id: features
        run: python scripts/localization_features.py --github-output "$GITHUB_OUTPUT"

  localize:
    needs: policy
    if: inputs.enabled && needs.policy.outputs.images_enabled == 'true'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.batch.outputs.audit_ready }}
      published: ${{ steps.publish.outputs.published }}
    timeout-minutes: 350
    env:
      WORK: work/image-localization-25
      MAX_SECONDS: ${{ inputs.max_seconds }}
      MAX_ITEMS: ${{ inputs.max_items }}
      SKIP_GENERATION: ${{ inputs.skip_generation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pipeline dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r pipelines/image/requirements-injection.txt pytest==8.4.2 msgpack pycryptodome

      - name: Verify reviewed outputs against the frozen cohort
        id: current
        run: python scripts/image_ci_state.py --report image-current-state.json --github-output "$GITHUB_OUTPUT"

      - name: Restore image work state
        uses: actions/cache/restore@v4
        with:
          path: work/image-localization-25
          key: image-work-${{ github.run_number }}
          restore-keys: |
            image-work-

      - name: Report effective rate limit
        if: steps.current.outputs.needs_work == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'pipelines/image')
          import provider_config
          info = provider_config.inspect(provider_config.load_config())
          print(json.dumps(info, ensure_ascii=False, indent=2))
          interval = float(info['min_request_interval_seconds'])
          if interval < 60:
              raise SystemExit(
                  f"refusing to run: min_request_interval_seconds={interval} is below the "
                  "60s (one request per minute) limit this workflow exists to respect")
          PY

      - name: Preflight
        run: |
          set -euo pipefail
          missing=0
          require () {
            if [ ! -e "$1" ]; then
              echo "::error::missing $1 -- $2"
              missing=1
            fi
          }
          require "$WORK/manifest.jsonl" \
            "prepared texture cohort; produce it with pipelines/image/prepare_mltd_image25_review.py"
          require "$WORK/reconstructed-preprocess/summary.json" \
            "vision triage; produce it with pipelines/image/preprocess_reconstructed.py --classify"
          if [ "$missing" -ne 0 ]; then
            echo "No usable cohort/triage state was restored."
            echo "The pipeline needs a prepared cohort before it can generate: download the official"
            echo "bundles, run the reconstruction + classification triage once, and let this workflow's"
            echo "cache carry that state into the next run."
            exit 1
          fi
          echo "Cohort state present; continuing."

      - name: Pipeline contract tests
        run: |
          set -euo pipefail
          python -m pytest -p no:cacheprovider -q \
            pipelines/image/test_image_injection_contract.py \
            pipelines/image/test_moderation_batch.py

      - name: Generate images (serial, at most one request per minute)
        if: steps.current.outputs.needs_work == 'true' && !inputs.skip_generation
        run: |
          set -euo pipefail
          echo "time budget ${MAX_SECONDS}s, item cap ${MAX_ITEMS} (0 = unlimited)"
          python -u pipelines/image/run_reconstructed_batch.py \
            --max-seconds "$MAX_SECONDS" \
            --max-items "$MAX_ITEMS"

      - name: Check whether the batch finished or needs another run
        id: batch
        run: |
          python scripts/image_ci_state.py \
            --batch-progress "$WORK/reconstructed-preprocess/batch-progress.json" \
            --report "$WORK/batch-status.json" --github-output "$GITHUB_OUTPUT"

      - name: Independent audit (the only approval gate)
        if: steps.batch.outputs.audit_ready == 'true'
        run: |
          set -euo pipefail
          python -u pipelines/image/audit_reconstructed_release.py \
            --work "$WORK" \
            --output-dir "$WORK/release-prep"

      - name: Approve automatically (no human sign-off)
        if: steps.batch.outputs.audit_ready == 'true'
        # The audit above is the gate; this step only translates a clean audit
        # into the install manifest the injector accepts.  It refuses any run
        # with audit errors, upstream-declined images or failed tasks, so it can
        # never approve a partial cohort.
        run: |
          set -euo pipefail
          python -u pipelines/image/auto_approve_reconstructed.py \
            --audit-report "$WORK/release-prep/report.json" \
            --verified-candidates "$WORK/release-prep/verified-candidates.jsonl" \
            --work "$WORK" \
            --bundle-root "$WORK/bundles" \
            --out "$WORK/release-prep/install-manifest.jsonl"

      - name: Inject and independently verify the translated image bundles
        if: steps.batch.outputs.audit_ready == 'true'
        run: |
          set -euo pipefail
          python pipelines/image/inject_reviewed_textures.py \
            --all --install-manifest "$WORK/release-prep/install-manifest.jsonl" \
            --original-root "$WORK" --out "$WORK/injected-${GITHUB_RUN_ID}" \
            --report "$WORK/release-prep/injection-report.json"
          python pipelines/image/verify_bundle_repack.py \
            --report "$WORK/release-prep/injection-report.json" \
            --install-manifest "$WORK/release-prep/install-manifest.jsonl" \
            --audit "$WORK/release-prep/repack-independent-audit.json"
          python scripts/publish_image_overlay.py \
            --version-manifest manifests/asset-version.json \
            --report "$WORK/release-prep/injection-report.json" \
            --audit "$WORK/release-prep/repack-independent-audit.json" \
            --work "$WORK/release-prep"

      - name: Commit audited image overlay for unified packaging
        id: publish
        if: steps.batch.outputs.audit_ready == 'true'
        run: |
          set -euo pipefail
          ASSET_VERSION="$(python -c "import json; print(json.load(open('manifests/asset-version.json'))['asset_version'])")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "image-overlay/${ASSET_VERSION}"
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "ci(images): stage audited overlay for unified release [skip ci]"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Upload progress and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-progress-${{ github.run_number }}
          retention-days: 7
          path: |
            image-current-state.json
            work/image-localization-25/batch-status.json
            work/image-localization-25/reconstructed-preprocess/batch-progress.json
            work/image-localization-25/release-prep/*.json
            work/image-localization-25/release-prep/*.jsonl
          if-no-files-found: warn

      - name: Save image work state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/image-localization-25
          key: image-work-${{ github.run_number }}
