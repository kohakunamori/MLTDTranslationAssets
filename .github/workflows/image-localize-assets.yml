name: Reusable - incremental image localization
'on':
  workflow_call:
    inputs:
      enabled:
        type: boolean
        default: false
      max_items:
        type: string
        default: '0'
    outputs:
      ready:
        value: ${{ jobs.publish.outputs.ready }}
      published:
        value: ${{ jobs.publish.outputs.published }}
      remaining:
        value: ${{ jobs.publish.outputs.remaining }}
      completed:
        value: ${{ jobs.publish.outputs.completed }}

permissions:
  contents: write
  actions: read
concurrency:
  group: image-localize-assets
  queue: max
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.features.outputs.images_generation_enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            configs
            scripts
      - id: features
        run: python scripts/localization_features.py --github-output "$GITHUB_OUTPUT"

  prepare:
    needs: policy
    if: inputs.enabled && needs.policy.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      queue: ${{ steps.queue.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            configs
            manifests
            scripts
            pipelines
            generated
            images
            !/generated/objects/
            !/generated/build-inputs/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hosted extraction and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn tesseract-ocr-jpn-vert
          python -m pip install -r pipelines/image/requirements-injection.txt msgpack pycryptodome requests
      - name: Discover current image backlog and prepare a bounded batch
        env:
          IMAGE_LIMIT: ${{ inputs.max_items }}
        run: python -u scripts/incremental_images.py prepare --work work/image-batch --limit "$IMAGE_LIMIT"
      - id: queue
        run: echo "sha=$(sha256sum work/image-batch/queue.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: image-prepared
          path: work/image-batch
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: image-api-inputs
          path: |
            work/image-batch/queue.json
            work/image-batch/tasks
          retention-days: 3

  localize:
    needs: [policy, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: images-provider
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            configs
            scripts
            pipelines
            manifests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: image-api-inputs
          path: work/image-api
      - name: Verify exact prepared queue
        env:
          QUEUE_SHA: ${{ needs.prepare.outputs.queue }}
        run: echo "$QUEUE_SHA  work/image-api/queue.json" | sha256sum -c -
      - uses: actions/cache/restore@v4
        with:
          key: image-api-${{ needs.prepare.outputs.queue }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: image-api-${{ needs.prepare.outputs.queue }}-
          path: |
            work/image-api/results.json
            work/image-api/request-time.json
            work/image-api/tasks/**/*-generated.png
            work/image-api/tasks/**/*-candidate.png
            work/image-api/visual-reviews
      - name: Translate images through configured backend and independently review
        env:
          MLTD_LLM_API_KEY: ${{ secrets.MLTD_LLM_API_KEY }}
        run: python -u scripts/incremental_images.py generate --work work/image-api --max-seconds 7200
      - uses: actions/cache/save@v4
        if: always()
        with:
          key: image-api-${{ needs.prepare.outputs.queue }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/image-api/results.json
            work/image-api/request-time.json
            work/image-api/tasks/**/*-generated.png
            work/image-api/tasks/**/*-candidate.png
            work/image-api/visual-reviews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-api-results
          path: |
            work/image-api/results.json
            work/image-api/tasks/**/*-generated.png
            work/image-api/tasks/**/*-candidate.png
            work/image-api/visual-reviews
          retention-days: 3

  publish:
    needs: [prepare, localize]
    # Preserve completed generations even if a later provider call fails.
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.localize.result == 'success' || needs.localize.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: r2-mutation
      queue: max
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.package.outputs.ready }}
      published: ${{ steps.commit.outputs.published }}
      remaining: ${{ steps.package.outputs.remaining }}
      completed: ${{ steps.package.outputs.completed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/generated/objects/
            !/generated/build-inputs/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hosted publication and Japanese completeness checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn tesseract-ocr-jpn-vert
          python -m pip install -r pipelines/image/requirements-injection.txt msgpack requests pycryptodome
      - uses: actions/download-artifact@v4
        with:
          name: image-prepared
          path: work/image-batch
      - uses: actions/download-artifact@v4
        with:
          name: image-api-results
          path: work/image-batch
      - name: Verify source-bound visual acceptance and package whole images
        id: package
        run: python scripts/incremental_images.py package --work work/image-batch
      - name: Inject and independently verify the translated image bundles
        if: steps.package.outputs.has_images == 'true'
        run: |
          python pipelines/image/inject_reviewed_textures.py --all \
            --install-manifest work/image-batch/install.jsonl --original-root work/image-batch \
            --out work/image-batch/injected --report work/image-batch/injection-report.json
          python pipelines/image/verify_bundle_repack.py \
            --report work/image-batch/injection-report.json --install-manifest work/image-batch/install.jsonl \
            --audit work/image-batch/repack-independent-audit.json
          python scripts/publish_image_overlay.py --version-manifest manifests/asset-version.json \
            --report work/image-batch/injection-report.json --audit work/image-batch/repack-independent-audit.json \
            --work work/image-batch
      - name: Publish verified overlay objects to R2
        if: steps.package.outputs.has_images == 'true'
        env:
          R2_PUBLISH_TOKEN: ${{ secrets.R2_PUBLISH_TOKEN }}
        run: |
          version=$(python -c 'import json; print(json.load(open("manifests/asset-version.json"))["asset_version"])')
          python scripts/r2_release_storage.py publish-overlay --overlay-version "$version"
      - name: Commit translation sources and audited metadata
        id: commit
        run: |
          set -euo pipefail
          cp work/image-batch/next-state.json manifests/image-incremental.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images manifests/image-incremental.json manifests/image-generation-cache.json manifests/image-visual-reviews.json image-overlay generated/r2-storage.json
          if ! git diff --cached --quiet; then
            git commit -m "Localize incremental image batch [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-publication-audit
          path: |
            work/image-batch/queue.json
            work/image-batch/next-state.json
            work/image-batch/*report.json
            work/image-batch/*audit.json
          retention-days: 7
