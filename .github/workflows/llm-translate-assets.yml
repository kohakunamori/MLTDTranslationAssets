name: Reusable - synchronize and translate sources

'on':
  workflow_call:
    inputs:
      source_commit:
        type: string
        required: true
      expected_version:
        type: string
        required: true
      max_items:
        type: string
        default: '0'
      max_bundles:
        type: string
        default: '0'
      max_new_rows:
        type: string
        default: '0'
      full_rescan:
        type: boolean
        default: false
      publish_drafts:
        type: string
        default: 'true'
    outputs:
      ready:
        value: ${{ jobs.package.outputs.ready }}
      published:
        value: ${{ jobs.package.outputs.published }}
      remaining:
        value: ${{ jobs.draft.outputs.remaining }}
      updated:
        value: ${{ jobs.draft.outputs.updated }}
      stopped:
        value: ${{ jobs.draft.outputs.stopped }}
      image_remaining:
        value: ${{ jobs.images.outputs.remaining }}
      image_completed:
        value: ${{ jobs.images.outputs.completed }}

permissions:
  contents: write
  issues: write
  # The caller owns build/deployment and bounded backlog continuation.
  actions: write

concurrency:
  group: assets-llm-translation
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  prepare:
    name: Synchronize official sources on hosted disk
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.handoff.outputs.source_commit }}
      sha256: ${{ steps.handoff.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read localization feature policy
        id: features
        run: |
          python scripts/localization_features.py \
            --github-output "$GITHUB_OUTPUT" --report .localization-features.json
          echo 'Image generation is independent of publication of existing image translations.'

      - name: Install translation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check httpx msgpack UnityPy Pillow pycryptodome

      - name: Detect latest official asset version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        shell: bash
        run: python scripts/track_jp_assets.py --update --expected-latest-version "$EXPECTED_VERSION" --output-json .llm-asset-check.json

      - name: Extract new source rows from official latest assets
        shell: bash
        run: |
          set -euo pipefail
          # Observing a version is independent of completing source extraction.
          # Always synchronize; the content memo keeps unchanged runs cheap.
          args=(scripts/refresh_latest_official_catalogue.py
                  --bundle-index manifests/official-bundle-index.json)
            bundle_limit='${{ inputs.max_bundles }}'
            if [ -n "$bundle_limit" ] && [ "$bundle_limit" != 0 ]; then
              args+=(--max-bundles "$bundle_limit")
            fi
            row_cap='${{ inputs.max_new_rows }}'
            if [ -n "$row_cap" ] && [ "$row_cap" != 0 ]; then
              args+=(--max-new-rows "$row_cap")
            fi
            if [ '${{ inputs.full_rescan }}' = 'true' ]; then
              args+=(--full-rescan)
            fi
          python "${args[@]}"

      - name: Extract event-unit dialogue
        shell: bash
        run: |
          set -euo pipefail
          index=".llm-official-work/$(python -c 'import json; print(json.load(open("manifests/asset-version.json"))["index_name"])')"
          test -f "$index"
          args=(scripts/event_unit_localization.py --index "$index")
          if [ '${{ inputs.full_rescan }}' = 'true' ]; then args+=(--full-rescan); fi
          python "${args[@]}" | tee .llm-event-units.json

      - name: Discover new localizable bundles
        # The step that used to be missing.  The refresh above can only re-verify
        # the bundles the repository already carries, so an official bundle that
        # was never tracked -- a new event's story, a new song's lyrics -- stayed
        # invisible forever.  This reads the index the refresh just downloaded and
        # reports what is new, how big it is, and which resource families are
        # entirely unseen; the inventory it writes is the baseline for the "new
        # family" warning.  Exit 2 = a cap tripped: the run stops instead of
        # pulling an unbounded batch (fail closed, same policy as the refresh).
        shell: bash
        run: |
          set -euo pipefail
          index=".llm-official-work/$(python -c 'import json; print(json.load(open("manifests/asset-version.json"))["index_name"])')"
          test -f "$index"
          python scripts/discover_official_bundles.py \
            --index "$index" \
            --report .llm-discovery.json | tee .llm-discovery-summary.json

      - name: Extract new song lyrics
        # Song lyrics are a second source tree (lyrics/songs/*.jsonl).  Without
        # this step a new song would be counted by the discovery above and then
        # dropped: only text bundles had a refresh path.
        shell: bash
        run: |
          set -euo pipefail
          index=".llm-official-work/$(python -c 'import json; print(json.load(open("manifests/asset-version.json"))["index_name"])')"
          test -f "$index"
          args=(scripts/refresh_lyrics_catalogue.py --index "$index")
          if [ '${{ inputs.full_rescan }}' = 'true' ]; then args+=(--full-rescan); fi
          python "${args[@]}" | tee .llm-lyrics.json

      - name: Verify source synchronization and detect image coverage
        shell: bash
        run: |
          set -euo pipefail
          index=".llm-official-work/$(python -c 'import json; print(json.load(open("manifests/asset-version.json"))["index_name"])')"
          python scripts/localization_coverage.py --index "$index" --require-source-sync | tee .llm-coverage.json

      - name: Reuse approved lyric translations
        # One Japanese line appears in several bundle renditions (scrobj_priam+.unity3d
        # and scrobj_priam.unity3d carry the same slot).  Copying the approved Chinese is
        # what this library already does: of the 2,651 sources that appear in more than
        # one row, 2,324 carry byte-identical text and none diverge.
        #
        # Translating the copies again is not free.  It spends tokens, it makes one
        # Japanese line read three ways across bundles, and it can fail a rule the
        # original already satisfied: the "+" renditions were waiting on rows whose
        # Japanese source contains a line break, which the model reproduces faithfully
        # and the lyric validator always refuses.  Runs #26 and #27 of 2026-10-12
        # returned the same two-line draft for those five rows, so retrying could never
        # settle them.  Running this before the collector also keeps those lines out of
        # the paid queue.
        shell: bash
        run: |
          set -euo pipefail
          python scripts/llm_translate_untranslated.py reuse --scope lyrics | tee .llm-reuse.json

      - name: Freeze bounded text handoff
        id: handoff
        run: |
          python scripts/text_job_handoff.py pack \
            --directory .mltd-text-handoff --source-commit "$(git rev-parse HEAD)"

      - name: Save exact-run text handoff
        uses: actions/cache/save@v4
        with:
          path: .mltd-text-handoff
          key: text-handoff-${{ github.run_id }}-${{ github.run_attempt }}

  draft:
    needs: prepare
    # Standard GitHub-hosted runners are free for this public repository.
    # Only the API key is imported from Actions secrets into an ephemeral
    # runner-temp file.
    runs-on: ubuntu-latest
    # A cold cache re-verifies every tracked bundle (~1 hour); the memo makes a
    # normal run minutes. Anything past three hours is a hang, not progress.
    timeout-minutes: 180
    outputs:
      images_generation_enabled: ${{ steps.features.outputs.images_generation_enabled }}
      published: ${{ steps.commit.outputs.published == 'true' || steps.apply.outputs.published == 'true' }}
      remaining: ${{ steps.backlog.outputs.remaining }}
      updated: ${{ steps.apply.outputs.updated }}
      # Why the in-job retry loop stopped: `drained`, `no_progress`, `budget`,
      # `max_rounds` or `limited`.  Only the two middle reasons mean rows are
      # still waiting because this run ran out of room; the caller uses it to
      # decide whether another whole pipeline run is worth it.
      stopped: ${{ steps.translate.outputs.stopped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
          filter: blob:none
          # Generated release bundles belong to the hosted packaging job.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/generated/
            !/images/
            !/image-overlay/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore exact-run text handoff
        uses: actions/cache/restore@v4
        with:
          path: .mltd-text-handoff
          key: text-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Verify and materialize synchronized text sources
        env:
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          HANDOFF_SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python scripts/text_job_handoff.py restore \
            --directory .mltd-text-handoff \
            --source-commit "$SOURCE_COMMIT" --sha256 "$HANDOFF_SHA256"

      - name: Read localization feature policy
        id: features
        run: |
          python scripts/localization_features.py \
            --github-output "$GITHUB_OUTPUT" --report .localization-features.json
          echo 'Image generation is independent of publication of existing image translations.'

      - name: Install translation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check httpx msgpack UnityPy Pillow pycryptodome

      - name: Materialize provider configuration from secrets
        shell: bash
        env:
          MLTD_LLM_API_KEY: ${{ secrets.MLTD_LLM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MLTD_LLM_API_KEY"
          cfg_dir="$RUNNER_TEMP/mltd-llm"
          install -d -m 700 "$cfg_dir"
          cp configs/api-models.example.json "$cfg_dir/api-models.local.json"
          cp configs/api-models.presets.example.json "$cfg_dir/api-models.presets.json"
          python - "$cfg_dir/api-runtime.local.json" "$MLTD_LLM_API_KEY" <<'PY'
          import json
          import pathlib
          import sys
          out = pathlib.Path(sys.argv[1])
          key = sys.argv[2]
          out.write_text(json.dumps({
              "schema_version": 3,
              "environment": {"api_key": {"MLTD_API_KEY": key}},
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          chmod 600 "$cfg_dir/api-models.local.json" "$cfg_dir/api-models.presets.json" "$cfg_dir/api-runtime.local.json"
          echo "MLTD_LLM_CONFIG_PATH=$cfg_dir/api-models.local.json" >> "$GITHUB_ENV"
          echo "LLM_CONFIG_PATH=$cfg_dir/api-models.local.json" >> "$GITHUB_ENV"

      - name: Collect untranslated rows
        # scope=all covers both source trees: the generated text release
        # (locales/) and the song lyric library (lyrics/songs/).  English-bypass
        # lyric lines are excluded by the collector, not translated and then
        # discarded.
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          python scripts/llm_translate_untranslated.py collect --scope all --output .llm-queue.jsonl
          # An empty queue is the normal case on a day with no new source rows.
          # Everything expensive below is gated on this count, so a nightly run
          # with nothing to translate costs seconds instead of re-verifying
          # every tracked bundle.  Promotion and the commit still run: they also
          # carry a version-manifest bump and drafts left over from earlier runs.
          size=$(python -c 'import pathlib; print(sum(1 for line in pathlib.Path(".llm-queue.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()))')
          echo "queue_size=$size" >> "$GITHUB_OUTPUT"
          echo "Untranslated rows to translate: $size"

      - name: Prepare project prompt inputs
        if: steps.collect.outputs.queue_size != '0'
        shell: bash
        run: |
          printf '%s\n' '{"schema_version":1,"speakers":{}}' > .llm-character-evidence.json

      - name: Translate the queue in bounded rounds
        # A handful of items always end up failing every provider attempt. That
        # is not a reason to discard the ~99% that succeeded: tolerate the exit
        # code here and let the apply/commit steps publish what was accepted.
        # The summary step below still fails the run when nothing was accepted.
        #
        # Those leftovers are usually not broken rows.  The pool samples
        # non-deterministically, and a line refused twice for writing "68" where
        # the reviewer wants "六十八" is routinely accepted on a later sample, so
        # the retry belongs in this job.  Until 2026-10-27 the only retry was a
        # re-dispatch from the caller, and each one cost a full build plus a
        # gateway deployment: asset 1077950 spent three extra end-to-end runs
        # (~48 minutes) settling three lines.  Each round here costs seconds.
        #
        # Everything is bounded so a bad day cannot hang the job: a wall-clock
        # budget, a round count, an attempt budget per row (a row that survives
        # every round is disagreeing with a QA rule, not with the dice), and the
        # per-round row cap below.
        id: translate
        if: steps.collect.outputs.queue_size != '0'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          count=$(wc -l < .llm-queue.jsonl)
          if [ "$count" -eq 0 ]; then
            echo 'No untranslated rows.'
            exit 0
          fi
          limit='${{ inputs.max_items }}'
          # An operator-supplied limit means "translate this many rows, now": one
          # round, no retry.  A scheduled run keeps 500 rows per round so a large
          # recovered surface still survives the three-hour job timeout.
          single_shot=()
          if [ -n "$limit" ] && [ "$limit" != 0 ]; then
            single_shot=(--single-shot)
          else
            limit=500
          fi

          state=.llm-loop-state.json
          rm -f "$state" .llm-draft.jsonl .llm-failed.jsonl .llm-summary.json
          : > .llm-draft.jsonl
          while :; do
            # Every bound is stated here instead of relying on the helper's
            # defaults: 30 minutes of wall clock, four rounds, and four attempts
            # per row are the policy this job promises its caller.
            python scripts/llm_translation_rounds.py plan \
              --queue .llm-queue.jsonl \
              --state "$state" \
              --round-output .llm-round-queue.jsonl \
              --plan-json .llm-loop-plan.json \
              --budget-seconds 1800 \
              --max-rounds 4 \
              --max-attempts 4 \
              --github-output "$GITHUB_OUTPUT" \
              "${single_shot[@]}"
            # The round number comes from the state, so the per-round file names
            # cannot drift from the number the summary reports.
            round=$(python -c 'import json; d=json.load(open(".llm-loop-plan.json")); print(d["round"] if d["run"] else "")')
            run=$(python -c 'import json; print(json.load(open(".llm-loop-plan.json"))["run"])')
            if [ "$run" != 1 ]; then break; fi
            rm -f .llm-round-draft.jsonl .llm-round-failed.jsonl ".llm-round-summary-${round}.json"
            started=$SECONDS
            # The public Assets repository uses the tested single-item path; the
            # optional Batch V2 adapter is not part of this repository.  A
            # non-zero exit still leaves the rows this round did finish on disk,
            # and the record step below is what counts them.
            python pipelines/text/translate_mltd_api_pool.py \
              --input .llm-round-queue.jsonl \
              --output .llm-round-draft.jsonl \
              --failed-output .llm-round-failed.jsonl \
              --summary ".llm-round-summary-${round}.json" \
              --config "$MLTD_LLM_CONFIG_PATH" \
              --no-default-resume \
              --batch-mode single \
              --glossary glossary/authoritative-terms.json \
              --authoritative-terms glossary/authoritative-terms.json \
              --character-evidence .llm-character-evidence.json \
              --prompt-source compiled \
              --system-prompt .llm-system-prompt.md \
              --prompt-manifest pipelines/text/configs/mltd-zhcn-system.manifest.json \
              --max-items "$limit" \
              || echo "::warning title=Translation round ${round}::the provider pool exited non-zero; the rows it did finish are kept."
            if [ -f .llm-round-draft.jsonl ]; then
              cat .llm-round-draft.jsonl >> .llm-draft.jsonl
            fi
            python scripts/llm_translation_rounds.py record \
              --state "$state" \
              --draft .llm-round-draft.jsonl \
              --failed .llm-round-failed.jsonl \
              --elapsed "$((SECONDS - started))" \
              --github-output "$GITHUB_OUTPUT"
          done

          summary_args=()
          for file in .llm-round-summary-*.json; do
            if [ -f "$file" ]; then summary_args+=(--round-summary "$file"); fi
          done
          python scripts/llm_translation_rounds.py finish \
            --state "$state" \
            --queue .llm-queue.jsonl \
            --failed-out .llm-failed.jsonl \
            --summary-out .llm-summary.json \
            --github-output "$GITHUB_OUTPUT" \
            "${summary_args[@]}"

      - name: Apply LLM translations
        # Explicitly not gated on the tolerated translate failure above; still
        # skipped when an earlier step really failed, so a broken workspace is
        # never turned into a commit.
        id: apply
        if: steps.collect.outputs.queue_size != '0' && (success() || steps.translate.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .llm-draft.jsonl ]; then
            echo 'No draft output.'
            exit 0
          fi
          python scripts/llm_translate_untranslated.py apply --draft .llm-draft.jsonl --scope all | tee .llm-apply.json
          echo "updated=$(python -c 'import json; print(json.load(open(".llm-apply.json"))["updated"])')" >> "$GITHUB_OUTPUT"
          python scripts/validate_repo.py

          # Publish what just validated, before anything else can fail.  These
          # rows are still `pending`, so no release reads them until the
          # promotion below; committing them here is what makes a night's work
          # survivable.  Run 38058410546 applied 2,937 rows and lost all of them
          # because the failure came after this point, and recovering the batch
          # from its diagnostics artifact took a human.
          python scripts/commit_llm_drafts.py

      - name: Publish machine drafts for the generated build
        # Machine output is admitted to generated/<asset_version>/ here, and only
        # here: this step flips `pending` + `llm_translated` rows to
        # `status=accepted` while KEEPING the `llm_translated` provenance.  The
        # row is therefore admitted to the release without being relabelled as
        # human-reviewed, and no row the machine did not write is touched.
        # Disable per run with publish_drafts=false, or globally by setting the
        # repository variable MLTD_PUBLISH_LLM_DRAFTS=false.
        id: publish
        if: >-
          (success() || steps.apply.outcome == 'success') &&
          inputs.publish_drafts != 'false' &&
          vars.MLTD_PUBLISH_LLM_DRAFTS != 'false'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/llm_translate_untranslated.py publish --dry-run
          python scripts/llm_translate_untranslated.py publish | tee .llm-publish.json
          # Lyrics are promoted with the same provenance rule but a song-local
          # agreement rule instead of the release-ambiguity gate: two wordings of
          # the same line inside one song stay pending for a human.
          python scripts/llm_translate_untranslated.py publish --scope lyrics --dry-run
          python scripts/llm_translate_untranslated.py publish --scope lyrics | tee .llm-publish-lyrics.json
          # Promotion turns on the accepted-row protected-token gate, so the
          # repository must be revalidated between promotion and the commit.
          python scripts/validate_repo.py

      - name: Refresh translation backlog report
        id: backlog
        if: >-
          (success() || steps.apply.outcome == 'success') &&
          steps.publish.outcome != 'failure'
        shell: bash
        run: |
          set -euo pipefail
          index=".llm-official-work/$(python -c 'import json; print(json.load(open("manifests/asset-version.json"))["index_name"])')"
          python scripts/localization_coverage.py --index "$index" --require-source-sync | tee .llm-coverage.json
          python scripts/llm_translate_untranslated.py collect --scope all --output .llm-remaining.jsonl
          echo "remaining=$(wc -l < .llm-remaining.jsonl)" >> "$GITHUB_OUTPUT"

      - name: Commit LLM translations to main
        # Runs whenever the apply step itself validated, even if a few queue
        # items failed terminally; never runs after a failed apply or a failed
        # promotion.  A failed promotion must not be committed as if the run's
        # local state were the reviewed state.
        #
        # The same script already ran at the end of the apply step, where the new
        # rows are still `pending`.  This second call records the promotion:
        # the message and the body come from the run's own `.llm-publish*.json`
        # reports, so neither call can describe work the other one did.
        id: commit
        if: >-
          (success() || steps.apply.outcome == 'success') &&
          steps.publish.outcome != 'failure'
        shell: bash
        run: python scripts/commit_llm_drafts.py

      - name: Upload translation diagnostics
        # Preserve review evidence on every run; optional artifact quota failures
        # cannot override the separately verified translation/publish verdict.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: llm-translation-diagnostics
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
          path: |
            .localization-features.json
            .llm-summary.json
            .llm-failed.jsonl
            .llm-draft.jsonl
            .llm-queue.jsonl
            .llm-loop-state.json
            .llm-loop-plan.json
            .llm-round-summary-*.json
            .llm-asset-check.json
            .llm-publish.json
            .llm-publish-lyrics.json
            .llm-discovery.json
            .llm-discovery-summary.json
            .llm-lyrics.json
            .llm-reuse.json
            .llm-event-units.json
            .llm-apply.json
            .llm-remaining.jsonl
            .llm-coverage.json
            manifests/localization-coverage.json

      - name: Summarize translation outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .llm-coverage.json ]; then
            cat .llm-coverage.json
            echo 'Image coverage was inventoried; existing compatible translations can publish while generation is paused.'
          fi
          # The promotion runs even when this run's queue was empty, so report it
          # before the translation summary's early exit.
          if [ -f .llm-publish.json ]; then
            promoted=$(python -c 'import json; print(json.load(open(".llm-publish.json"))["promoted"])')
            echo "Machine drafts promoted to accepted: $promoted"
          else
            echo 'No machine-draft promotion ran in this run.'
          fi
          if [ -f .llm-publish-lyrics.json ]; then
            lyric_promoted=$(python -c 'import json; print(json.load(open(".llm-publish-lyrics.json"))["promoted"])')
            echo "Song lyric rows promoted to accepted: $lyric_promoted"
          fi
          # Discovery and lyric extraction are the two steps that used to be
          # missing entirely; report them even on a night with nothing to do, so
          # "the pipeline saw no new content" is distinguishable from "the
          # pipeline never looked".
          if [ -f .llm-discovery-summary.json ]; then
            python -c 'import json; d=json.load(open(".llm-discovery-summary.json",encoding="utf-8")); l=d.get("localizable",{}); print("discovery: %s official bundles, %s new localizable (%s bytes), %s new resource families" % (d.get("official_bundles",0), len(l.get("new_bundles",[])), l.get("new_bytes",0), d.get("unclassified",{}).get("new_family_count",0)))'
          else
            echo 'Discovery did not run in this run.'
          fi
          if [ -f .llm-lyrics.json ]; then
            python -c 'import json; d=json.load(open(".llm-lyrics.json",encoding="utf-8")); print("lyrics: new songs=%s changed=%s extracted=%s empty=%s failures=%s" % (len(d.get("new_songs",[])), len(d.get("changed_songs",[])), len(d.get("extracted",[])), len(d.get("empty",[])), len(d.get("failures",[]))))'
          fi
          if [ ! -f .llm-summary.json ]; then
            echo 'No translation summary was produced by this run.'
            exit 0
          fi
          accepted=$(python -c 'import json; print(json.load(open(".llm-summary.json")).get("accepted", 0))')
          failed=$(python -c 'import json; print(json.load(open(".llm-summary.json")).get("failed", 0))')
          rounds=$(python -c 'import json; print(json.load(open(".llm-summary.json")).get("rounds", 0))')
          stopped=$(python -c 'import json; print(json.load(open(".llm-summary.json")).get("stopped", ""))')
          queue=0
          if [ -f .llm-queue.jsonl ]; then queue=$(wc -l < .llm-queue.jsonl); fi
          echo "accepted=$accepted failed=$failed queue=$queue rounds=$rounds stopped=$stopped"
          if [ "$failed" -gt 0 ]; then
            echo "::warning title=Partial LLM translation failures::$failed of $((accepted + failed)) items could not be settled in $rounds retry round(s) (the loop stopped: $stopped); the $accepted accepted rows were still published. A row that survives every round is disagreeing with a QA rule rather than with the sampler, so inspect the llm-translation-diagnostics artifact."
          fi
          # A total provider outage has to be loud, but a queue that only holds a
          # few stubborn rows would otherwise fail - and open an issue - every
          # single day. Healthy ~1.3k-row runs fail 0.5-1.5% of their items, so a
          # failed count this high with nothing accepted means the pool is down;
          # smaller leftovers stay a warning and are retried by the next run.
          if [ "$accepted" -eq 0 ] && [ "$failed" -ge 50 ]; then
            echo "::error title=LLM translation produced no accepted rows::$failed of $queue queued items failed and none were accepted; nothing was published."
            exit 1
          fi

      - name: Report a real failure as a tracking issue
        # Only genuine breakage reaches here: a partial QA failure is a warning,
        # so a silently broken pipeline is visible instead of failing quietly.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title='Auto-apply LLM translations failed'
          body=$(printf 'Workflow run: %s/%s/actions/runs/%s\n\nDownload the `llm-translation-diagnostics` artifact of that run for `.llm-summary.json`, `.llm-queue.jsonl` and `.llm-failed.jsonl`.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "$title in:title" --limit 1 --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || echo 'warning: could not comment on the tracking issue'
            echo "Commented on open issue #$existing."
          else
            gh issue create --title "$title" --body "$body" || echo 'warning: could not create a tracking issue'
          fi

  images:
    name: Localize images for the same release
    needs: draft
    if: needs.draft.result == 'success' && needs.draft.outputs.images_generation_enabled == 'true'
    uses: ./.github/workflows/image-localize-assets.yml
    with:
      enabled: true
    secrets: inherit

  package:
    name: Report unified localization readiness
    needs: [draft, images]
    if: >-
      always() && !cancelled() && needs.draft.result == 'success' &&
      (needs.draft.outputs.images_generation_enabled != 'true' ||
       (needs.images.result == 'success' && needs.images.outputs.ready == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      published: ${{ needs.draft.outputs.published == 'true' || needs.images.outputs.published == 'true' }}
    steps:
      - name: Report localized release readiness to the caller
        id: ready
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
