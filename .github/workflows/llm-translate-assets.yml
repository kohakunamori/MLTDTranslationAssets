name: Auto-apply LLM translations

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Optional queue limit for a smoke run'
        required: false
        default: '0'
      max_bundles:
        description: 'Optional official-bundle limit for a smoke run'
        required: false
        default: '0'
      max_new_rows:
        description: 'Accept an append larger than the default new-row cap (0 keeps the script default)'
        required: false
        default: '0'
      full_rescan:
        description: 'Ignore manifests/official-bundle-index.json and re-download every tracked bundle'
        required: false
        type: boolean
        default: false
      publish_drafts:
        description: 'Publish machine drafts to the generated build (set false to keep them pending for review)'
        required: false
        default: 'true'

permissions:
  contents: write
  issues: write
  # The generated build must be dispatched explicitly: a GITHUB_TOKEN push does
  # not create workflow runs, and workflow_dispatch is one of the two events
  # exempt from that suppression.
  actions: write

concurrency:
  group: assets-llm-translation
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  draft:
    # GitHub-hosted Linux is intentional: the provider is the public HTTPS
    # gateway configured in configs/api-models.example.json. Only the API key
    # is imported from Actions secrets into an ephemeral runner-temp file.
    runs-on: ubuntu-latest
    # A cold cache re-verifies every tracked bundle (~1 hour); the memo makes a
    # normal run minutes. Anything past three hours is a hang, not progress.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install translation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check httpx msgpack UnityPy Pillow pycryptodome

      - name: Materialize provider configuration from secrets
        shell: bash
        env:
          MLTD_LLM_API_KEY: ${{ secrets.MLTD_LLM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MLTD_LLM_API_KEY"
          cfg_dir="$RUNNER_TEMP/mltd-llm"
          install -d -m 700 "$cfg_dir"
          cp configs/api-models.example.json "$cfg_dir/api-models.local.json"
          cp configs/api-models.presets.example.json "$cfg_dir/api-models.presets.json"
          python - "$cfg_dir/api-runtime.local.json" "$MLTD_LLM_API_KEY" <<'PY'
          import json
          import pathlib
          import sys
          out = pathlib.Path(sys.argv[1])
          key = sys.argv[2]
          out.write_text(json.dumps({
              "schema_version": 3,
              "environment": {"api_key": {"MLTD_API_KEY": key}},
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          chmod 600 "$cfg_dir/api-models.local.json" "$cfg_dir/api-models.presets.json" "$cfg_dir/api-runtime.local.json"
          echo "MLTD_LLM_CONFIG_PATH=$cfg_dir/api-models.local.json" >> "$GITHUB_ENV"
          echo "LLM_CONFIG_PATH=$cfg_dir/api-models.local.json" >> "$GITHUB_ENV"

      - name: Detect latest official asset version
        shell: bash
        run: python scripts/track_jp_assets.py --update --output-json .llm-asset-check.json

      - name: Extract new source rows from official latest assets
        shell: bash
        run: |
          set -euo pipefail
          has_update=$(python -c 'import json; print(str(json.load(open(".llm-asset-check.json"))["has_update"]).lower())')
          if [ "$has_update" = true ]; then
            args=(scripts/refresh_latest_official_catalogue.py
                  --bundle-index manifests/official-bundle-index.json)
            bundle_limit='${{ inputs.max_bundles }}'
            if [ -n "$bundle_limit" ] && [ "$bundle_limit" != 0 ]; then
              args+=(--max-bundles "$bundle_limit")
            fi
            row_cap='${{ inputs.max_new_rows }}'
            if [ -n "$row_cap" ] && [ "$row_cap" != 0 ]; then
              args+=(--max-new-rows "$row_cap")
            fi
            if [ '${{ inputs.full_rescan }}' = 'true' ]; then
              args+=(--full-rescan)
            fi
            python "${args[@]}"
          else
            echo 'Official asset version unchanged; skip bundle download.'
          fi

      - name: Collect untranslated rows
        shell: bash
        run: python scripts/llm_translate_untranslated.py collect --output .llm-queue.jsonl

      - name: Prepare project prompt inputs
        shell: bash
        run: |
          printf '%s\n' '{"schema_version":1,"speakers":{}}' > .llm-character-evidence.json

      - name: Translate with the existing provider pool
        # A handful of items always end up failing every provider attempt. That
        # is not a reason to discard the ~99% that succeeded: tolerate the exit
        # code here and let the apply/commit steps publish what was accepted.
        # The summary step below still fails the run when nothing was accepted.
        id: translate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          count=$(wc -l < .llm-queue.jsonl)
          if [ "$count" -eq 0 ]; then
            echo 'No untranslated rows.'
            exit 0
          fi
          limit='${{ inputs.max_items }}'
          args=(
            --input .llm-queue.jsonl
            --output .llm-draft.jsonl
            --failed-output .llm-failed.jsonl
            --summary .llm-summary.json
            --config "$MLTD_LLM_CONFIG_PATH"
            --no-default-resume
            # The public Assets repository uses the tested single-item path;
            # the optional Batch V2 adapter is not part of this repository.
            --batch-mode single
            --glossary glossary/authoritative-terms.json
            --authoritative-terms glossary/authoritative-terms.json
            --character-evidence .llm-character-evidence.json
            --prompt-source compiled
            --system-prompt .llm-system-prompt.md
            --prompt-manifest pipelines/text/configs/mltd-zhcn-system.manifest.json
          )
          if [ -n "$limit" ] && [ "$limit" != 0 ]; then args+=(--max-items "$limit"); fi
          python pipelines/text/translate_mltd_api_pool.py "${args[@]}"

      - name: Apply LLM translations
        # Explicitly not gated on the tolerated translate failure above; still
        # skipped when an earlier step really failed, so a broken workspace is
        # never turned into a commit.
        id: apply
        if: success() || steps.translate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .llm-draft.jsonl ]; then
            echo 'No draft output.'
            exit 0
          fi
          python scripts/llm_translate_untranslated.py apply --draft .llm-draft.jsonl
          python scripts/validate_repo.py

      - name: Publish machine drafts for the generated build
        # Machine output is admitted to generated/<asset_version>/ here, and only
        # here: this step flips `pending` + `llm_translated` rows to
        # `status=accepted` while KEEPING the `llm_translated` provenance.  The
        # row is therefore admitted to the release without being relabelled as
        # human-reviewed, and no row the machine did not write is touched.
        # Disable per run with publish_drafts=false, or globally by setting the
        # repository variable MLTD_PUBLISH_LLM_DRAFTS=false.
        id: publish
        if: >-
          (success() || steps.apply.outcome == 'success') &&
          inputs.publish_drafts != 'false' &&
          vars.MLTD_PUBLISH_LLM_DRAFTS != 'false'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/llm_translate_untranslated.py publish --dry-run
          python scripts/llm_translate_untranslated.py publish | tee .llm-publish.json
          # Promotion turns on the accepted-row protected-token gate, so the
          # repository must be revalidated between promotion and the commit.
          python scripts/validate_repo.py

      - name: Commit LLM translations to main
        # Runs whenever the apply step itself validated, even if a few queue
        # items failed terminally; never runs after a failed apply or a failed
        # promotion.  A failed promotion must not be committed as if the run's
        # local state were the reviewed state.
        id: commit
        if: >-
          (success() || steps.apply.outcome == 'success') &&
          steps.publish.outcome != 'failure'
        shell: bash
        run: |
          set -euo pipefail
          paths=(locales manifests/asset-version.json)
          if [ -f manifests/official-bundle-index.json ]; then
            paths+=(manifests/official-bundle-index.json)
          fi
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'No changes to publish.'
            exit 0
          fi
          version=$(python -c 'import json; print(json.load(open("manifests/asset-version.json"))["asset_version"])')
          promoted=0
          if [ -f .llm-publish.json ]; then
            promoted=$(python -c 'import json; print(json.load(open(".llm-publish.json"))["promoted"])')
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          if [ "$promoted" -gt 0 ]; then
            git commit -m "ci(assets): apply and publish LLM drafts for asset $version" \
                       -m "Machine drafts admitted to the generated build: $promoted row(s); translation_stage stays llm_translated."
          else
            git commit -m "ci(assets): apply LLM translations for asset $version"
          fi

          # Publish directly to main by policy. Never force-push: if another
          # workflow advances main, rebase this generated commit and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Published LLM translations to main on attempt $attempt."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'main advanced during LLM publish; refusing to force-push.' >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
            python scripts/validate_repo.py
          done

      - name: Trigger the generated Assets build
        # Without this dispatch the freshly published rows would sit on main
        # until some unrelated push happened to trigger assets-generated.yml:
        # a GITHUB_TOKEN push never starts another workflow run.
        if: steps.commit.outputs.published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run assets-generated.yml --ref main
          echo 'Dispatched assets-generated.yml on main.'

      - name: Upload translation diagnostics
        # Always keep the evidence: the failed items and the accepted drafts are
        # otherwise lost with the runner, which is what made the 2026-10 outage
        # invisible.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-translation-diagnostics
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
          path: |
            .llm-summary.json
            .llm-failed.jsonl
            .llm-draft.jsonl
            .llm-queue.jsonl
            .llm-asset-check.json
            .llm-publish.json

      - name: Summarize translation outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # The promotion runs even when this run's queue was empty, so report it
          # before the translation summary's early exit.
          if [ -f .llm-publish.json ]; then
            promoted=$(python -c 'import json; print(json.load(open(".llm-publish.json"))["promoted"])')
            echo "Machine drafts promoted to accepted: $promoted"
          else
            echo 'No machine-draft promotion ran in this run.'
          fi
          if [ ! -f .llm-summary.json ]; then
            echo 'No translation summary was produced by this run.'
            exit 0
          fi
          accepted=$(python -c 'import json; print(json.load(open(".llm-summary.json")).get("accepted", 0))')
          failed=$(python -c 'import json; print(json.load(open(".llm-summary.json")).get("failed", 0))')
          queue=0
          if [ -f .llm-queue.jsonl ]; then queue=$(wc -l < .llm-queue.jsonl); fi
          echo "accepted=$accepted failed=$failed queue=$queue"
          if [ "$failed" -gt 0 ]; then
            echo "::warning title=Partial LLM translation failures::$failed of $((accepted + failed)) items failed every provider attempt; the $accepted accepted rows were still published. Inspect the llm-translation-diagnostics artifact."
          fi
          # A total provider outage has to be loud, but a queue that only holds a
          # few stubborn rows would otherwise fail - and open an issue - every
          # single day. Healthy ~1.3k-row runs fail 0.5-1.5% of their items, so a
          # failed count this high with nothing accepted means the pool is down;
          # smaller leftovers stay a warning and are retried by the next run.
          if [ "$accepted" -eq 0 ] && [ "$failed" -ge 50 ]; then
            echo "::error title=LLM translation produced no accepted rows::$failed of $queue queued items failed and none were accepted; nothing was published."
            exit 1
          fi

      - name: Report a real failure as a tracking issue
        # Only genuine breakage reaches here: a partial QA failure is a warning,
        # so a silently broken pipeline is visible instead of failing quietly.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title='Auto-apply LLM translations failed'
          body=$(printf 'Workflow run: %s/%s/actions/runs/%s\n\nDownload the `llm-translation-diagnostics` artifact of that run for `.llm-summary.json`, `.llm-queue.jsonl` and `.llm-failed.jsonl`.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "$title in:title" --limit 1 --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || echo 'warning: could not comment on the tracking issue'
            echo "Commented on open issue #$existing."
          else
            gh issue create --title "$title" --body "$body" || echo 'warning: could not create a tracking issue'
          fi
