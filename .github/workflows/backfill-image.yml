name: Backfill Uploaded Images

# The portal's image studio only has to *store* an uploaded Chinese composite
# plus queue a row; slicing it back into the 512x512 texture needs Pillow, so
# the work runs here and the result is written back to the asset bucket.

on:
  schedule:
    # Offset from the asset-version cron so the two never start together.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum jobs to process in this run'
        required: false
        default: '20'
        type: string

jobs:
  backfill:
    name: Slice and Paste Uploaded Composites
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MLTD_ASSET_BASE: https://pub-mltd-assets.nyaneko.cn
      LIMIT: ${{ github.event.inputs.limit || '20' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install imaging dependency
        run: pip install --quiet pillow

      - name: List queued backfills
        id: queue
        run: |
          python - <<'PY' > work-queue.json
          import json, os, urllib.error, urllib.parse, urllib.request

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          # Queue rows live in the portal's D1 database, same account as the bucket.
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{os.environ.get('PORTAL_D1_ID', '6dadc7c5-b994-48ea-a35a-a96698b572d5')}/query"
          body = json.dumps({
              "sql": "SELECT id, task_id, upload_key FROM image_restore_requests WHERE status='queued' ORDER BY created_at ASC LIMIT ?",
              "params": [int(os.environ["LIMIT"])],
          }).encode()
          req = urllib.request.Request(url, data=body, headers={
              "Authorization": f"Bearer {token}", "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              payload = json.load(resp)
          rows = (payload.get("result") or [{}])[0].get("results") or []
          print(json.dumps([{"id": r["id"], "task_id": r["task_id"], "upload_key": r["upload_key"]} for r in rows]))
          PY
          echo "queued=$(python -c "import json;print(len(json.load(open('work-queue.json'))))")" >> $GITHUB_OUTPUT

      - name: Restore queued uploads
        if: steps.queue.outputs.queued != '0'
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          jobs = json.loads(Path("work-queue.json").read_text(encoding="utf-8"))
          batch = []
          for job in jobs:
              batch.append({
                  "task_id": job["task_id"],
                  "model_url": f"{__import__('os').environ['MLTD_ASSET_BASE']}/{job['upload_key']}",
                  "job_id": job["id"],
              })
          Path("work/batch.json").parent.mkdir(parents=True, exist_ok=True)
          Path("work/batch.json").write_text(json.dumps(batch), encoding="utf-8")
          subprocess.run([sys.executable, "scripts/restore/restore_texture.py",
                          "--batch", "work/batch.json", "--out-dir", "images/localized"],
                         check=False)
          PY

      - name: Publish localized textures
        run: |
          python scripts/restore/publish_localized.py --dir images/localized --manifest manifests/images.manifest.json

      - name: Mark queue rows finished
        run: |
          python scripts/restore/report_restore_status.py --summary work/restore-summary.json --ledger work/restore-ledger.json

      - name: Commit manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/images.manifest.json
          if git diff --cached --quiet; then
            echo "No manifest change; nothing to commit."
            exit 0
          fi
          git commit -m "chore(images): record $(python -c "import json;print(len(json.load(open('work/restore-summary.json'))))") restored texture(s)"
          git push
