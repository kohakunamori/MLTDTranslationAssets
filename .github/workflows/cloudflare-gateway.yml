name: Reusable - deploy and verify R2 gateway

'on':
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cloudflare-gateway
  cancel-in-progress: false

jobs:
  deploy:
    concurrency:
      group: r2-mutation
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Only metadata is checked out; acceptance restores a few verified R2 samples.
    timeout-minutes: 30
    steps:
      - name: Check whether a Cloudflare token is configured
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Gateway deploy skipped::CLOUDFLARE_API_TOKEN is not set, so the gateway was not updated. Add it (a token with the 'Edit Cloudflare Workers' permission) plus CLOUDFLARE_ACCOUNT_ID as repository secrets to let this workflow publish automatically."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the release tree
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            asset-server
            configs
            manifests
            scripts

      - name: Add the generated release to the checkout
        if: steps.guard.outputs.configured == 'true'
        run: git sparse-checkout add generated

      - name: Set up Python
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the gateway table from the newest release
        if: steps.guard.outputs.configured == 'true'
        run: python asset-server/cloudflare/build_index.py --apply

      - name: Test the version-less recovery rule
        if: steps.guard.outputs.configured == 'true'
        # Offline: the harness runs the real worker source with stubbed Worker
        # globals and checks that a refusal is only retried for a version-less
        # request, that a retry which is not 2xx returns the original response,
        # and that a version-carrying or covered request never touches the feed.
        run: |
          node asset-server/cloudflare/test_newest_version_fallback.mjs
          node asset-server/cloudflare/test_packed_gateway.mjs
          node asset-server/cloudflare/test_range_cache.mjs
          node asset-server/r2-publisher/test_publisher.mjs

      - name: Deploy to Cloudflare
        if: steps.guard.outputs.configured == 'true'
        working-directory: asset-server/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Deploy the authenticated R2 publisher
        if: steps.guard.outputs.configured == 'true'
        working-directory: asset-server/r2-publisher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Restore verified samples for live acceptance
        if: steps.guard.outputs.configured == 'true'
        env:
          R2_PUBLISH_TOKEN: ${{ secrets.R2_PUBLISH_TOKEN }}
          R2_CI_CLASS_B_LIMIT: '100'
        run: |
          python -m pip install --quiet requests
          python scripts/r2_release_storage.py restore --no-cache --samples 3

      - name: Verify the live gateway against this release
        if: steps.guard.outputs.configured == 'true'
        # Real HTTPS, byte-for-byte against verified R2 samples: if the deploy
        # did not take, this fails the run.
        #
        # Retry first.  Cloudflare keeps serving the previous worker version for a
        # few seconds after a successful deploy, and gateway run #18 read
        # live=f7de7355 twice while the deploy had in fact succeeded: the same URL
          # reported the new commit a minute later and the external watcher agreed.  A
        # false red here reads as a broken release and makes the watcher dispatch
        # another deploy for nothing.
        run: |
          python -m pip install --quiet msgpack
          for attempt in 1 2 3 4 5 6; do
            if python asset-server/cloudflare/check_gateway.py \
                 --base https://mltd-asset-cf.nyaneko.cn --samples 3; then
              exit 0
            fi
            echo "attempt ${attempt}: the edge has not picked this release up yet; retrying in 20s"
            sleep 20
          done
          echo "the live gateway never served this release; failing the run" >&2
          exit 1

      - name: Verify two distinct live assets share one immutable R2 pack
        if: steps.guard.outputs.configured == 'true'
        run: python scripts/verify_packed_gateway.py --base https://mltd-asset-cf.nyaneko.cn

      - name: Enforce two-release R2 retention after successful live acceptance
        if: steps.guard.outputs.configured == 'true'
        env:
          R2_PUBLISH_TOKEN: ${{ secrets.R2_PUBLISH_TOKEN }}
          R2_CI_CLASS_B_LIMIT: '100'
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Main advanced during deployment; leave GC for the next accepted deployment.'
            exit 0
          fi
          python scripts/r2_release_storage.py prune --apply
