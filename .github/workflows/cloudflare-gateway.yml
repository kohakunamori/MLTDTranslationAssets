name: Deploy Cloudflare Gateway

# Keeps the Cloudflare gateway in step with this repository.
#
# Where the trigger comes from: "Build generated Assets" dispatches this workflow
# explicitly (it needs `actions: write` for that), only after it actually pushed a
# release commit.
#
# Why not `push`: those release commits always carry `[skip ci]`, and GitHub
# suppresses push-triggered workflows for exactly those commits.
#
# Why not `workflow_run` either (it used to be the trigger): a run that has
# *completed* does fire this one, but only when the finishing run came from a
# push.  Every build that the translation workflow dispatched by itself has been
# silently skipped -- builds #40, #52, #54 and #62 on 2026-10-10..12 produced four
# release commits and zero gateway deploys, so the live gateway was left anchored
# two releases behind main (`/healthz` said `fe71c9c2` while main was `e54d92ad`).
# The explicit dispatch is what makes both entry points behave the same.
on:
  push:
    branches: [main]
    paths:
      - 'asset-server/cloudflare/**'
      - '.github/workflows/cloudflare-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The checkout pulls the whole content-addressed object pool (~1 GB, of which
    # this release references ~640 MiB) so that `build_index.py` can verify every
    # object it indexes against its own SHA-256; that is the slow part of this job.
    timeout-minutes: 30
    steps:
      - name: Check whether a Cloudflare token is configured
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Gateway deploy skipped::CLOUDFLARE_API_TOKEN is not set, so the gateway was not updated. Add it (a token with the 'Edit Cloudflare Workers' permission) plus CLOUDFLARE_ACCOUNT_ID as repository secrets to let this workflow publish automatically."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the release tree
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            asset-server
            manifests

      - name: Add the generated release to the checkout
        if: steps.guard.outputs.configured == 'true'
        run: git sparse-checkout add generated

      - name: Set up Python
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the gateway table from the newest release
        if: steps.guard.outputs.configured == 'true'
        run: python asset-server/cloudflare/build_index.py --apply

      - name: Test the version-less recovery rule
        if: steps.guard.outputs.configured == 'true'
        # Offline: the harness runs the real worker source with stubbed Worker
        # globals and checks that a refusal is only retried for a version-less
        # request, that a retry which is not 2xx returns the original response,
        # and that a version-carrying or covered request never touches the feed.
        run: node asset-server/cloudflare/test_newest_version_fallback.mjs

      - name: Deploy to Cloudflare
        if: steps.guard.outputs.configured == 'true'
        working-directory: asset-server/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Verify the live gateway against this release
        if: steps.guard.outputs.configured == 'true'
        # Real HTTPS, byte-for-byte against the object pool that was just
        # checked out: if the deploy did not take, this fails the run.
        #
        # Retry first.  Cloudflare keeps serving the previous worker version for a
        # few seconds after a successful deploy, and gateway run #18 read
        # live=f7de7355 twice while the deploy had in fact succeeded: the same URL
        # reported the new commit a minute later and the VPS watcher agreed.  A
        # false red here reads as a broken release and makes the watcher dispatch
        # another deploy for nothing.
        run: |
          python -m pip install --quiet msgpack
          for attempt in 1 2 3 4 5 6; do
            if python asset-server/cloudflare/check_gateway.py \
                 --base https://mltd-asset-cf.nyaneko.cn --samples 3; then
              exit 0
            fi
            echo "attempt ${attempt}: the edge has not picked this release up yet; retrying in 20s"
            sleep 20
          done
          echo "the live gateway never served this release; failing the run" >&2
          exit 1
