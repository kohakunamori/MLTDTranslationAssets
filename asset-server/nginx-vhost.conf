# Project-owned MLTD static asset vhost for shared NAS nginx:18443.
server {
    listen 18443 ssl;
    listen [::]:18443 ssl;
    server_name mltd-asset.nyaneko.cn;
    http2 on;

    ssl_certificate /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;

    location = /healthz {
        return 200 "ok\n";
    }

    location ^~ /assets/current/ {
        limit_except GET HEAD { deny all; }
        alias /srv/imas/mltd/current/;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        limit_except GET HEAD { deny all; }
        alias /srv/imas/mltd/views/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 从 1077100 起把客户端可见的 /cn/ 命名空间接到 generated mirror：
    # runtime_path 优先返回 GitHub CI 产物；未迁移版本/未翻译对象由 resolver
    # 依次回落旧 cn-version overlay，再回落同版本官方日文对象。旧版本同样
    # 通过兼容回落保持可用，因此不需要切换客户端基址。
    location ^~ /cn/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18765/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-MLTD-Asset-Namespace "cn";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-MLTD-Asset-Source "generated-mirror" always;
    }

    location ~ ^/([0-9]+)/production/2018/Android/(.+)$ {
        limit_except GET HEAD { deny all; }
        alias /srv/imas/mltd/views/$1/jp-android/$2;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # GitHub-generated localization mirror.  This is intentionally a separate
    # namespace from the legacy /cn overlay: it carries an explicit
    # asset_version and the loopback resolver maps the official catalog's
    # hashed runtime paths to translated CAS objects, with read-only official
    # CDN fallback for untranslated objects.
    location ^~ /generated-assets/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18765/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-MLTD-Asset-Source "generated-mirror" always;
    }

    location / {
        limit_except GET HEAD { deny all; }
        return 404;
    }
}
