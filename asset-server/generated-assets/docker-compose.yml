services:
  generated-assets:
    build: .
    image: local/mltd-generated-assets:20260930
    container_name: mltd-generated-assets
    restart: unless-stopped
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - /vol2/1000/imas-asset-archive/mltd/generated:/data:ro
      - /vol2/1000/imas-asset-archive/mltd:/official:ro
      - /vol2/1000/imas-asset-archive/mltd/generated-official-cache:/official-cache
    command: ["python", "/app/assets_route.py", "serve", "--root", "/data", "--bind", "127.0.0.1", "--port", "18765", "--official-root", "/official", "--official-base-url", "https://td-assets.bn765.com", "--official-cache-root", "/official-cache", "--legacy-overlay-root", "/official/cn-version"]
  generated-assets-sync:
    build: .
    image: local/mltd-generated-assets:20260930
    container_name: mltd-generated-assets-sync
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - /vol2/1000/imas-asset-archive/mltd/generated:/data
    environment:
      MLTD_ASSETS_REPOSITORY: kohakunamori/MLTDTranslationAssets
      MLTD_ASSETS_BRANCH: main
      MLTD_SYNC_INTERVAL: "21600"
      MLTD_MIN_ASSET_VERSION: "100"
      # One object is one HTTPS request, and a release that adds lyrics and images
      # adds hundreds of them.  Measured on this NAS through the LAN proxy below:
      # 1.65 s per object one at a time, 0.42 s per object with eight in flight.
      # Sixteen in flight started tripping the proxy, so this is the measured
      # sweet spot rather than a round number.
      MLTD_MIRROR_OBJECT_WORKERS: "8"
      # Anonymous GitHub API access allows 60 requests an hour and one tick uses
      # about 40 of them (a listing plus a manifest and checksums per version).
      # A token raises that to 5,000.  It is read from the project's .env so the
      # credential never enters this repository, and an empty value is simply
      # anonymous access, which is what the deployment has today.
      MLTD_ASSETS_GITHUB_TOKEN: ${MLTD_ASSETS_GITHUB_TOKEN:-}
      HTTP_PROXY: http://192.168.2.31:7890
      HTTPS_PROXY: http://192.168.2.31:7890
      NO_PROXY: 127.0.0.1,localhost
    command: ["python", "/app/sync_loop.py", "--root", "/data"]
