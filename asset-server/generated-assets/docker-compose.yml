services:
  generated-assets:
    build: .
    image: local/mltd-generated-assets:20260930
    container_name: mltd-generated-assets
    restart: unless-stopped
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${MLTD_GENERATED_ROOT:?Set MLTD_GENERATED_ROOT in .env}:/data:ro
      - ${MLTD_ARCHIVE_ROOT:?Set MLTD_ARCHIVE_ROOT in .env}:/official:ro
      - ${MLTD_OFFICIAL_CACHE_ROOT:?Set MLTD_OFFICIAL_CACHE_ROOT in .env}:/official-cache
    command: ["python", "/app/serve_release.py", "serve", "--root", "/data", "--bind", "127.0.0.1", "--port", "18765", "--official-root", "/official", "--official-base-url", "https://td-assets.bn765.com", "--official-cache-root", "/official-cache", "--legacy-overlay-root", "/official/cn-version"]
  generated-assets-sync:
    build: .
    image: local/mltd-generated-assets:20260930
    container_name: mltd-generated-assets-sync
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${MLTD_GENERATED_ROOT:?Set MLTD_GENERATED_ROOT in .env}:/data
    environment:
      MLTD_ASSETS_REPOSITORY: kohakunamori/MLTDTranslationAssets
      MLTD_ASSETS_BRANCH: main
      MLTD_SYNC_INTERVAL: "21600"
      # Keep concurrency bounded so the upstream and any configured proxy remain stable.
      MLTD_MIRROR_OBJECT_WORKERS: "8"
      # Anonymous GitHub API access allows 60 requests an hour and one tick uses
      # about 40 of them (a listing plus a manifest and checksums per version).
      # A token raises that to 5,000.  It is read from the project's .env so the
      # credential never enters this repository, and an empty value is simply
      # anonymous access, which is what the deployment has today.
      MLTD_ASSETS_GITHUB_TOKEN: ${MLTD_ASSETS_GITHUB_TOKEN:-}
      HTTP_PROXY: "${MLTD_ARCHIVE_PROXY:-}"
      HTTPS_PROXY: "${MLTD_ARCHIVE_PROXY:-}"
      NO_PROXY: 127.0.0.1,localhost
    command: ["python", "/app/sync_release.py", "--root", "/data"]
