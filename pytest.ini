[pytest]
# The repository contains large, ignored local-data/ snapshots and research
# worktrees. They are not part of the maintained product regression suite and
# may contain duplicate test module names, so keep default discovery scoped to
# the same suites used by CI and the architecture runbook.
testpaths =
    scripts
    pipelines/core
    pipelines/text
    pipelines/image
    asset-server
    server/tests
norecursedirs =
    local-data
    research-tools
    generated
    images
markers =
    workflow_contract: tests that read and assert .github/workflows/*.yml structure and contracts
    slow: tests that run multi-second git sandboxes, local servers, or heavy packaging suites
    e2e: end-to-end service or release pipeline tests

