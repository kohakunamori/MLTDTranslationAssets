[pytest]
# The repository contains large, ignored local-data/ snapshots and research
# worktrees. They are not part of the maintained product regression suite and
# may contain duplicate test module names, so keep default discovery scoped to
# the same suites used by CI and the architecture runbook.
testpaths =
    scripts
    pipelines/core
    pipelines/text
    pipelines/image
    asset-server
    server/tests
norecursedirs =
    local-data
    research-tools
    generated
    images

